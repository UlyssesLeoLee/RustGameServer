# 02-economy-service.yaml
# 角色：economy 域 Deployment + Service
# 状态：🔴 NO-GO 占位
# 实际值写入条件：economy 域 Lead 具名签字（Q-003 Saga 跨域核心，需独立决策权，per DEC-005）
# 关联：DTL-015/016 + SP-015/016 + Q-003 Saga 状态机
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_ECONOMY_DEPLOY_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: economy
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
    # Q-003 跨域核心 — 单独标签便于 NetworkPolicy 隔离
    rust-game-server.io/saga-critical: "true"
spec:
  replicas: PLACEHOLDER_ECONOMY_REPLICAS        # 2
  selector:
    matchLabels:
      app.kubernetes.io/name: economy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: economy
        rust-game-server.io/saga-critical: "true"
    spec:
      serviceAccountName: PLACEHOLDER_ECONOMY_SA
      containers:
        - name: economy
          image: PLACEHOLDER_ECONOMY_IMAGE
          ports:
            - name: grpc
              containerPort: PLACEHOLDER_ECONOMY_GRPC_PORT
            - name: metrics
              containerPort: PLACEHOLDER_ECONOMY_METRICS_PORT
          env:
            - name: RUST_LOG
              value: PLACEHOLDER_ECONOMY_LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: PLACEHOLDER_ECONOMY_DB_SECRET
                  key: PLACEHOLDER_ECONOMY_DB_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: PLACEHOLDER_OTEL_ENDPOINT
          resources:
            requests:
              cpu: PLACEHOLDER_ECONOMY_CPU_REQ       # 1000m
              memory: PLACEHOLDER_ECONOMY_MEM_REQ    # 1Gi
            limits:
              cpu: PLACEHOLDER_ECONOMY_CPU_LIM       # 4000m
              memory: PLACEHOLDER_ECONOMY_MEM_LIM    # 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_ECONOMY_SVC_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: economy
  ports:
    - name: grpc
      port: PLACEHOLDER_ECONOMY_GRPC_PORT
      targetPort: PLACEHOLDER_ECONOMY_GRPC_PORT
    - name: metrics
      port: PLACEHOLDER_ECONOMY_METRICS_PORT
      targetPort: PLACEHOLDER_ECONOMY_METRICS_PORT
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: PLACEHOLDER_ECONOMY_HPA_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: PLACEHOLDER_ECONOMY_DEPLOY_NAME
  minReplicas: PLACEHOLDER_ECONOMY_HPA_MIN       # 2
  maxReplicas: PLACEHOLDER_ECONOMY_HPA_MAX       # 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: PLACEHOLDER_ECONOMY_CPU_TARGET
