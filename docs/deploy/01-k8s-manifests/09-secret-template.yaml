# mTLS 证书 Secret（6 域 + 共享 CA）
# 实际值由 rgs-certgen 工具生成（per RGS-INC-002 §3 Step 4）
# 命名：rgs-tls-<domain>，每 Secret 包含 server.pem / server.key / ca.crt
apiVersion: v1
kind: Secret
metadata:
  name: rgs-tls-player
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/part-of: rust-game-server
type: Opaque
stringData:
  tls.crt: "REPLACE_BEFORE_DEPLOY_PLAYER_SERVER_CRT"
  tls.key: "REPLACE_BEFORE_DEPLOY_PLAYER_SERVER_KEY"
  ca.crt: "REPLACE_BEFORE_DEPLOY_CA_CRT"
---
