type: Opaque
stringData:
  ca.crt: "REPLACE_BEFORE_DEPLOY_CA_CRT"
---
# COC 操作员登录 Secret（**仅占位**）
apiVersion: v1
kind: Secret
metadata:
  name: coc-ops-secret
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: admin
    rust-game-server.io/coc: "true"
type: Opaque
stringData:
  coc-admin-password: "REPLACE_BEFORE_DEPLOY_COC_PASSWORD"
  coc-mfa-seed: "REPLACE_BEFORE_DEPLOY_COC_MFA_SEED"
---
# ghcr.io pull secret（Phase 0.5 Step 5 实际部署时由 SRE 替换为真实 GITHUB_TOKEN / PAT）
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: rust-game-server
  labels:
    app.kubernetes.io/part-of: rust-game-server
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_BEFORE_DEPLOY_GHCR_USER",
          "password": "REPLACE_BEFORE_DEPLOY_GHCR_PAT",
          "auth": "REPLACE_BEFORE_DEPLOY_GHCR_B64AUTH"
        }
      }
    }
