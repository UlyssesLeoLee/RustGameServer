# 09-secret-template.yaml
# 角色：Secret 模板（5 域 DB Secret + mTLS Secret 6 域 + COC 操作员 Secret）
# 状态：🟢 NO-GO 解除后实际值落地（per RGS-DEC-NOGO-001 + DEC-008 12 角色签字 2026-08-24）
# 实际值校准：
#   - SRE 具名：Ulysses（per DEC-008 兼任）
#   - 加密仓管理：实际 values 由 `rgs-certgen` 工具生成（per RGS-INC-002 §3 Step 4）
# 重要约束：
#   1. 本文件 values 全部为占位（"REPLACE_BEFORE_DEPLOY_*"），**禁止在 git 历史中提交实际 Secret values**
#   2. 实际 Secret 由 SRE 通过 rgs-certgen 工具 + sealed-secrets 注入
#   3. Secret values 替换前需 DBA + SRE + 5 域 Lead 联合签字
# 关联：RGS-IMPL-001 §3.4 Secret 管理 + RGS-INC-002 §3 Step 4 mTLS
---
apiVersion: v1
kind: Secret
metadata:
  name: player-db-secret
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/part-of: rust-game-server
type: Opaque
stringData:
  # 实际值由 `phase-0-5-step-4-cert-secret-inject.ps1`（Phase 0.5 Step 4）通过 rgs-certgen + DBA 协同注入
  # 格式：postgresql://player_user:REPLACE_BEFORE_DEPLOY@postgres:5432/player_db
  DATABASE_URL: "postgresql://player_user:REPLACE_BEFORE_DEPLOY_PLAYER_DB_PASSWORD@postgres:5432/player_db"
---
