# 09-secret-template.yaml
# 角色：Secret 模板（**仅占位结构，values 全部 `PLACEHOLDER_*` 或 `REPLACE_BEFORE_DEPLOY` 标记**）
# 状态：🔴 NO-GO 占位
# 实际值写入条件：SRE 具名 + 加密仓管理（**严禁明文提交到 git**）
# 重要约束：
#   1. 本文件 values 全部为占位，**禁止在 git 历史中提交实际 Secret values**
#   2. 实际 Secret 由 SRE 通过 sealed-secrets / external-secrets / vault 注入
#   3. Secret values 替换前需 DBA + SRE + 5 域 Lead 联合签字
# 关联：RGS-IMPL-001 §3.4 Secret 管理
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_PLAYER_DB_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: player
type: Opaque
stringData:
  # 实际值：postgres://player_user:REPLACE_BEFORE_DEPLOY@PLACEHOLDER_PLAYER_DB_HOST:5432/player_db
  PLACEHOLDER_PLAYER_DB_KEY: "REPLACE_BEFORE_DEPLOY_PLAYER_DB_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_ECONOMY_DB_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: economy
    rust-game-server.io/saga-critical: "true"
type: Opaque
stringData:
  PLACEHOLDER_ECONOMY_DB_KEY: "REPLACE_BEFORE_DEPLOY_ECONOMY_DB_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_MATCH_DB_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: match
type: Opaque
stringData:
  PLACEHOLDER_MATCH_DB_KEY: "REPLACE_BEFORE_DEPLOY_MATCH_DB_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_SOCIAL_DB_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: social
type: Opaque
stringData:
  PLACEHOLDER_SOCIAL_DB_KEY: "REPLACE_BEFORE_DEPLOY_SOCIAL_DB_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_ADMIN_DB_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: admin
type: Opaque
stringData:
  PLACEHOLDER_ADMIN_DB_KEY: "REPLACE_BEFORE_DEPLOY_ADMIN_DB_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_RGS_TLS_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/part-of: rust-game-server
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_BEFORE_DEPLOY_TLS_CRT"
  tls.key: "REPLACE_BEFORE_DEPLOY_TLS_KEY"
---
# COC 操作员登录 Secret（**仅占位**）
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_COC_OPS_SECRET
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    rust-game-server.io/coc: "true"
type: Opaque
stringData:
  coc-admin-password: "REPLACE_BEFORE_DEPLOY_COC_PASSWORD"
  coc-mfa-seed: "REPLACE_BEFORE_DEPLOY_COC_MFA_SEED"
