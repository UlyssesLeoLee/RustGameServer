# 03-match-service.yaml
# 角色：match 域 Deployment + Service + HPA + PDB（实时匹配，弹性需求高）
# 状态：🟢 NO-GO 解除后实际值落地（per RGS-DEC-NOGO-001 + DEC-008 12 角色签字 2026-08-24）
# 实际值校准：
#   - match 域 Lead：Ulysses（per DEC-008 兼任 + DEC-005 独立配置）
#   - binary size：8,393,728 bytes（per `cargo build --release --workspace` 2026-08-24 实测）
#   - service.rs：303 行（per src/service.rs 2026-08-23）
#   - 校准依据：RGS-INC-002 §4（match 3 副本 / 实时匹配 / 不部署 KEDA per §3.2 不可插入 Knative Activator）
# 关联：DTL-026 + SP-026 + RGS-BAS-001 §3.2 实时主路径保护原则
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: match-service-account
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: match
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: match
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: "0.1.0"
    rust-game-server.io/domain: match
    rust-game-server.io/real-time: "true"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # 实时主路径 — 0 中断
  selector:
    matchLabels:
      app.kubernetes.io/name: match
  template:
    metadata:
      labels:
        app.kubernetes.io/name: match
        app.kubernetes.io/component: domain-service
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: "0.1.0"
        rust-game-server.io/domain: match
        rust-game-server.io/real-time: "true"
    spec:
      serviceAccountName: match-service-account
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: match
          image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-match
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/match-service"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: 50053
              protocol: TCP
            - name: quic
              containerPort: 7000
              protocol: UDP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,match-service=debug,sqlx=warn,tonic=warn,quinn=warn"
            - name: GRPC_ADDR
              value: "0.0.0.0:50053"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: match-db-credentials
                  key: url
            - name: NATS_URI
              value: "nats://nats:4222"
            - name: RGS_TLS_DIR
              value: "/etc/rgs/certs"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "match-service"
            - name: RGS_DOMAIN
              value: "match"
            - name: MATCH_QUEUE_TIMEOUT_SEC
              value: "60"
            - name: MATCH_TICK_RATE_HZ
              value: "30"
            - name: RGS_ALLOW_INSECURE_GRPC
              value: "0"
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=127.0.0.1:50053
                - -tls
                - -tls-client-cert=/etc/rgs/certs/server.pem
                - -tls-client-key=/etc/rgs/certs/server.key
                - -tls-ca-cert=/etc/rgs/certs/ca.pem
                - -tls-server-name=match.service
                - -connect-timeout=2s
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=127.0.0.1:50053
                - -tls
                - -tls-client-cert=/etc/rgs/certs/server.pem
                - -tls-client-key=/etc/rgs/certs/server.key
                - -tls-ca-cert=/etc/rgs/certs/ca.pem
                - -tls-server-name=match.service
                - -connect-timeout=2s
            initialDelaySeconds: 5
            periodSeconds: 5       # 实时 — readiness 5s 频次
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: rgs-tls
              mountPath: /etc/rgs/certs
              readOnly: true
      volumes:
        - name: rgs-tls
          projected:
            sources:
              - secret:
                  name: rgs-secret-match-tls
                  items:
                    - key: tls.crt
                      path: server.pem
                    - key: tls.key
                      path: server.key
              - secret:
                  name: rgs-secret-ca
                  items:
                    - key: ca.pem
                      path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: match-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: match
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: match
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
      protocol: TCP
    - name: quic
      port: 7000
      targetPort: 7000
      protocol: UDP
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: match-service-hpa
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: match
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: match-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65   # 实时 — 提前扩缩，65% 触发
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 3
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: match-service-pdb
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: match
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: match
