# 03-match-service.yaml
# 角色：match 域 Deployment + Service（实时匹配，弹性需求高）
# 状态：🔴 NO-GO 占位
# 实际值写入条件：match 域 Lead 具名签字
# 关联：DTL-026 + SP-026
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_MATCH_DEPLOY_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: match
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
spec:
  replicas: PLACEHOLDER_MATCH_REPLICAS          # 3（初始最高 — 实时匹配）
  selector:
    matchLabels:
      app.kubernetes.io/name: match
  template:
    metadata:
      labels:
        app.kubernetes.io/name: match
    spec:
      serviceAccountName: PLACEHOLDER_MATCH_SA
      containers:
        - name: match
          image: PLACEHOLDER_MATCH_IMAGE
          ports:
            - name: grpc
              containerPort: PLACEHOLDER_MATCH_GRPC_PORT
            - name: quic
              containerPort: PLACEHOLDER_MATCH_QUIC_PORT
              protocol: UDP
            - name: metrics
              containerPort: PLACEHOLDER_MATCH_METRICS_PORT
          env:
            - name: RUST_LOG
              value: PLACEHOLDER_MATCH_LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: PLACEHOLDER_MATCH_DB_SECRET
                  key: PLACEHOLDER_MATCH_DB_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: PLACEHOLDER_OTEL_ENDPOINT
          resources:
            requests:
              cpu: PLACEHOLDER_MATCH_CPU_REQ
              memory: PLACEHOLDER_MATCH_MEM_REQ
            limits:
              cpu: PLACEHOLDER_MATCH_CPU_LIM
              memory: PLACEHOLDER_MATCH_MEM_LIM
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_MATCH_SVC_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: match
  ports:
    - name: grpc
      port: PLACEHOLDER_MATCH_GRPC_PORT
      targetPort: PLACEHOLDER_MATCH_GRPC_PORT
    - name: quic
      port: PLACEHOLDER_MATCH_QUIC_PORT
      targetPort: PLACEHOLDER_MATCH_QUIC_PORT
      protocol: UDP
    - name: metrics
      port: PLACEHOLDER_MATCH_METRICS_PORT
      targetPort: PLACEHOLDER_MATCH_METRICS_PORT
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: PLACEHOLDER_MATCH_HPA_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: PLACEHOLDER_MATCH_DEPLOY_NAME
  minReplicas: PLACEHOLDER_MATCH_HPA_MIN         # 3
  maxReplicas: PLACEHOLDER_MATCH_HPA_MAX         # 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: PLACEHOLDER_MATCH_CPU_TARGET
