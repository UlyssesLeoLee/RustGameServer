# 04-social-service.yaml
# 角色：social 域 Deployment + Service + HPA + PDB
# 状态：🟢 NO-GO 解除后实际值落地（per RGS-DEC-NOGO-001 + DEC-008 12 角色签字 2026-08-24）
# 实际值校准：
#   - social 域 Lead：Ulysses（per DEC-008 兼任 + DEC-005 独立配置）
#   - binary size：8,375,808 bytes（per `cargo build --release --workspace` 2026-08-24 实测）
#   - service.rs：309 行（per src/service.rs 2026-08-23）
#   - 校准依据：RGS-INC-002 §4（social 2 副本 / 中等流量 / 失败影响"中"）
# 关联：DTL-019/020 + SP-019/020
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: social-service-account
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: "0.1.0"
    rust-game-server.io/domain: social
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social
        app.kubernetes.io/component: domain-service
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: "0.1.0"
        rust-game-server.io/domain: social
    spec:
      serviceAccountName: social-service-account
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: social
          image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-social
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50054
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,social-service=debug,sqlx=warn,tonic=warn"
            - name: GRPC_ADDR
              value: "0.0.0.0:50054"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: social-db-secret
                  key: DATABASE_URL
            - name: NATS_URI
              value: "nats://nats:4222"
            - name: RGS_TLS_DIR
              value: "/etc/rgs/certs"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "social-service"
            - name: RGS_DOMAIN
              value: "social"
            - name: SOCIAL_FRIEND_LIST_CACHE_TTL_SEC
              value: "300"
            - name: SOCIAL_MESSAGE_BATCH_SIZE
              value: "50"
            - name: RGS_ALLOW_INSECURE_GRPC
              value: "0"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: rgs-tls
              mountPath: /etc/rgs/certs
              readOnly: true
      volumes:
        - name: rgs-tls
          secret:
            secretName: rgs-tls-social
            items:
              - key: tls.crt
                path: server.pem
              - key: tls.key
                path: server.key
              - key: ca.crt
                path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: social-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
  ports:
    - name: grpc
      port: 50054
      targetPort: 50054
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: social-service-hpa
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: social
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: social-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: social-service-pdb
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: social
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social
