#     limits: cpu 200m / memory 128Mi
#   rgs-web (Node 静态资源 serving, 0 依赖):
#     requests: cpu 50m / memory 64Mi
#     limits: cpu 200m / memory 128Mi
#   gm-console-envoy (独立 deployment, per AGENTS.md §7 派生约束 5):
