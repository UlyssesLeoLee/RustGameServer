# -----------------------------------------------------------------------
# L4-5: 资源估算公式 (per 9/1 18:00 JST SRE 拍板 + RGS-OLU-REPORT-token-OLU-2026-09-02 v0.2 §4)
# -----------------------------------------------------------------------
# 公式 1: 1 SRE ≤ 20 人·天/周 = 1 节点 CPU 50% + 内存 60%
#   推导: 1 SRE dev 集群假设 = 1 节点 4 CPU / 8Gi
#         业务域占 50% (2 CPU) + 内存 60% (4.8Gi) 是单 SRE 单元上限
#         1 SRE = 1 节点 = 5 域 (业务均分) + edge + mgmt + 平台
#
# 公式 2: token-OLU 换算 (per RGS-OLU-REPORT-token-OLU-2026-09-02 v0.2 §6.2)
#   1 人·天 ≈ 100K-300K tokens (含输入 + 输出 + 决策对话 + 验证往返)
#   1 人·周 ≈ 500K-1.5M tokens
#   1 SRE 上限 = 1 人·周 ≈ 1M tokens
#   5 域独立 Lead × 14-18 周 = 80-120M tokens (待 SRE Lead + PM 校准)
#
# 公式 3: 资源 buffer 推导 (per 8/31 ST 经验 HPA 启动风暴)
#   启动风暴因子: 1.5x (HPA minReplicas=1 → maxReplicas=5 同时拉起的瞬时请求)
#   镜像拉取因子: 1.2x (新镜像 cold start 时 cpu/memory 翻倍)
#   总缓冲: 1.5x × 1.2x = 1.8x, 实操取 1.5x (留 0.3x 给 HPA 平滑)
#   ResourceQuota = base × 1.5 (本文件 3 namespace ResourceQuota 沿用 1.2-1.5x 缓冲)
#
# 公式 4: HPA 扩容预测 (per 9/1 18:30 JST batch 域派生 + 8/31 HPA minReplicas 强启动风暴教训)
#   maxReplicas 推导: peak_qps / single_pod_qps × safety_factor
#     - 5 域 (业务域): peak_qps 1000 / single_pod_qps 200 = 5, safety_factor 1.0 → max 5
#     - batch (低频任务): peak_qps 100 / single_pod_qps 50 = 2, safety_factor 1.5 → max 3
#     - 3 NEW 域 (实时): peak_qps 800 / single_pod_qps 200 = 4, safety_factor 1.25 → max 5
#     - 工具 svc (管理): peak_qps 50 / single_pod_qps 25 = 2, safety_factor 1.0 → max 2
#   minReplicas 推导: baseline_pods + 1 (rolling update 期间保可用)
#     - 5 域: 1 + 1 = 2 (业务域高可用, 沿用 01-05 yaml minReplicas=2)
#     - batch: 0 + 1 = 1 (低频, 接受单点)
#     - 3 NEW 域: 0 + 1 = 1 (实时但 StatefulSet-like, 单实例够)
#     - 工具 svc: 0 + 1 = 1 (管理工具, 单实例可)
#
# 公式 5: 平均负载 (CPU/memory) 与扩容触发线
#   - CPU 70% 触发扩容 (per 5 域 yaml 现有 HPA, 沿用)
#   - 内存 75% 触发扩容 (per 5 域 yaml 现有 HPA, 沿用)
#   - stabilizationWindow 5min (scaleDown) / 0s (scaleUp) — 防抖动
#
# 已知缺口 (per 9/1 WBS v0.2 E4 §"缺标比错标"):
#   - 9/15 deadline 前未实测, ResourceQuota 1.5x 缓冲可能偏紧 (HPA 5 拉满 5×2Gi=10Gi vs quota 12Gi OK)
#   - 工具 svc 实际 peak_qps 未知 (mgmt 流量低, 暂估)
#   - 3 NEW 域 HPA 实战指标未跑 (Phase C 接入后)
#   - rgs-web 资源基线: 0 依赖 Node 静态资源, 沿用 gm-console 同档 (50m/64Mi-200m/128Mi)
#   - batch 域 1 写者约束 (per AGENTS.md §7 派生约束 8) 不影响 HPA 多实例, 暂保持 max=3
# -----------------------------------------------------------------------

