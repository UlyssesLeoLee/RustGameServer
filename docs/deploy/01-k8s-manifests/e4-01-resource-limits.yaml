# -----------------------------------------------------------------------
# L4-1: 5 域 svc request/limit 模板 (per 9/1 WBS v0.2 E4)
# -----------------------------------------------------------------------
# 适用: player / economy / match / social / admin (per 01-05 yaml)
# 模板值:
#   requests.cpu: 500m (1 SRE 业务域 base — 5 域合 2500m)
#   requests.memory: 512Mi (5 域合 2560Mi)
#   limits.cpu: 2000m (HPA maxReplicas=5 拉满时 5 域合 10000m, 留 2000m 缓冲)
#   limits.memory: 2Gi (5 域合 10Gi, ResourceQuota 12Gi 留 2Gi 缓冲)
#
# 依据 (per 9/1 18:00 JST SRE 拍板):
#   - 1 SRE ≤ 20 人·天/周 = 1 节点 CPU 50% (4 核 × 50% = 2 CPU = 2000m)
#   - 内存 60% (8Gi × 60% = 4.8Gi)
#   - 5 域均分: 每域 2000m / 5 = 400m ≈ 500m (向上取整)
#   - 内存均分: 4.8Gi / 5 = 960Mi ≈ 1Gi, 业务域限 512Mi (HPA 弹性 + QPS 缓冲)
#   - HPA maxReplicas=5 时 1 域上限: 500m × 10 (1:10 burst) = 5000m, 限 2000m (容器层 OOM 防护)
# -----------------------------------------------------------------------
apiVersion: v1
kind: LimitRange
metadata:
  name: domain-5domain-limits
  namespace: rust-game-server
  labels:
    rgs.io/e4-isolation: phase-c
    rgs.io/target-domain: 5domain
spec:
  limits:
    - type: Container
      default:
        # limits — 容器层硬上限 (HPA 拉满时节点不超 12 CPU)
        cpu: 2000m
        memory: 2Gi
      defaultRequest:
        # requests — 调度层软下限 (1 域 1 pod 资源保证)
        cpu: 500m
        memory: 512Mi
      max:
        # 单容器上限 (防止单 pod 独占节点)
        cpu: 4000m
        memory: 4Gi
      min:
        # 单容器下限 (防止极小请求抢占调度)
        cpu: 100m
        memory: 128Mi
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 1Gi

---
# -----------------------------------------------------------------------
# L4-2: batch svc request/limit 模板
# -----------------------------------------------------------------------
# 适用: rgs-batch-console / rgs-batch-backend / rgs-batch-envoy
# (per tools/rgs-batch-backend/k8s/70/71/75, E3 派工 commit 63908e7 已落地)
# 模板值 (per E3 实测):
#   rgs-batch-console (Node.js):
#     requests: cpu 50m / memory 64Mi
#     limits: cpu 200m / memory 128Mi
#   rgs-batch-backend (Rust + actix-web):
#     requests: cpu 100m / memory 128Mi
#     limits: cpu 500m / memory 512Mi
#   rgs-batch-envoy (边缘代理):
#     requests: cpu 50m / memory 64Mi
#     limits: cpu 200m / memory 128Mi
# 合计 (3 pod): requests 200m / 256Mi, limits 900m / 768Mi
# HPA maxReplicas=3: requests 600m / 768Mi, limits 2700m / 2304Mi
# ResourceQuota 已在 rgs-batch namespace 由 E3 落地 (per AGENTS.md §7 派生约束 5)
# -----------------------------------------------------------------------
apiVersion: v1
kind: LimitRange
metadata:
  name: domain-batch-limits
  namespace: rgs-batch
  labels:
    rgs.io/e4-isolation: phase-c
    rgs.io/target-domain: batch
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 1000m
        memory: 1Gi
      min:
        cpu: 25m
        memory: 32Mi

---
# -----------------------------------------------------------------------
# L4-3: 3 NEW 域 svc (scene/battle/network-gateway) request/limit 模板
# -----------------------------------------------------------------------
# 适用: scene-service / battle-service / network-gateway
# 模板值 (per 50/51/52 现有 yaml + E4 调整):
#   scene-service (轻量实时域):
#     requests: cpu 200m / memory 256Mi
#     limits: cpu 1000m / memory 1Gi
#   battle-service (中量实时域, 状态计算):
#     requests: cpu 300m / memory 384Mi
#     limits: cpu 1500m / memory 1.5Gi
#   network-gateway (Erlang/OTP 边缘网关, 启动慢):
#     requests: cpu 100m / memory 128Mi
#     limits: cpu 1000m / memory 512Mi
# HPA maxReplicas=5 拉满时合计: 17.5 CPU / 15Gi (ResourceQuota edge 21 CPU / 4Gi 不够, 见下方说明)
# 注意: edge namespace 4Gi 内存预算偏紧, 5 pod × 1.5Gi = 7.5Gi 实际需求;
#       9/15 deadline 前需 Phase C 接入后实测调整, 暂以 requests 上限约束
# -----------------------------------------------------------------------
apiVersion: v1
kind: LimitRange
metadata:
  name: domain-3new-limits
  namespace: rust-game-server-edge
  labels:
    rgs.io/e4-isolation: phase-c
    rgs.io/target-domain: 3new-edge
spec:
  limits:
    - type: Container
      default:
        cpu: 1500m
        memory: 1.5Gi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: 2000m
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi

---
