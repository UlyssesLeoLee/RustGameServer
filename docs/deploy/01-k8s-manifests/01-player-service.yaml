# 01-player-service.yaml
# 角色：player 域 Deployment + Service + HPA + PDB
# 状态：🟢 NO-GO 解除后实际值落地（per RGS-DEC-NOGO-001 + DEC-008 12 角色签字 2026-08-24）
# 实际值校准：
#   - player 域 Lead：Ulysses（per DEC-008 兼任）
#   - binary size：8,382,976 bytes（per `cargo build --release --workspace` 2026-08-24 实测）
#   - service.rs：331 行（per src/service.rs 2026-08-23）
#   - 校准依据：RGS-BAS-001 §3.2（Deployment + HPA 无状态）+ RGS-INC-002 §4（player minReplicas=2 / 失败影响极高）
# 关联：
#   - DTL-018 player 域详细设计
#   - SP-018 player 域实现规格
#   - BAS-018 player 域 BAS（V 模型右侧）
#   - REQ-018 player 域 REQ
#   - ARC-008 5 独立 DB 原则
#   - ADR-0052 Active-Active（不适用 player 域 — 单实例即可，cluster-ops 才需 Active-Active）
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: player-service-account
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: "0.1.0"
    rust-game-server.io/domain: player
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: player
  template:
    metadata:
      labels:
        app.kubernetes.io/name: player
        app.kubernetes.io/component: domain-service
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: "0.1.0"
        rust-game-server.io/domain: player
    spec:
      serviceAccountName: player-service-account
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: player
          image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-player
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/player-service"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: quic
              containerPort: 7000
              protocol: UDP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,player-service=debug,sqlx=warn,tonic=warn,quinn=warn"
            - name: GRPC_ADDR
              value: "0.0.0.0:50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: player-db-credentials
                  key: url
            - name: NATS_URI
              value: "nats://nats:4222"
            - name: RGS_TLS_DIR
              value: "/etc/rgs/certs"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "player-service"
            - name: RGS_DOMAIN
              value: "player"
            # 55.26 fail-closed mTLS：默认强制 mTLS；dev/test 临时 opt-out
            - name: RGS_ALLOW_INSECURE_GRPC
              value: "0"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=127.0.0.1:50051
                - -tls
                - -tls-client-cert=/etc/rgs/certs/server.pem
                - -tls-client-key=/etc/rgs/certs/server.key
                - -tls-ca-cert=/etc/rgs/certs/ca.pem
                - -tls-server-name=player.service
                - -connect-timeout=2s
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=127.0.0.1:50051
                - -tls
                - -tls-client-cert=/etc/rgs/certs/server.pem
                - -tls-client-key=/etc/rgs/certs/server.key
                - -tls-ca-cert=/etc/rgs/certs/ca.pem
                - -tls-server-name=player.service
                - -connect-timeout=2s
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: rgs-tls
              mountPath: /etc/rgs/certs
              readOnly: true
      volumes:
        - name: rgs-tls
          projected:
            sources:
              - secret:
                  name: rgs-secret-player-tls
                  items:
                    - key: tls.crt
                      path: server.pem
                    - key: tls.key
                      path: server.key
              - secret:
                  name: rgs-secret-ca
                  items:
                    - key: ca.pem
                      path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: player-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: player
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: quic
      port: 7000
      targetPort: 7000
      protocol: UDP
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: player-service-hpa
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: player-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: player-service-pdb
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: player
