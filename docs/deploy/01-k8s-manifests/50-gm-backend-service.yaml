# gm-backend APIGW(8 域第 8 域 / GM 后台)
# 部署形态:per RGS-BAS-003 §2.1 / 53 部署架构 / Ulysses 2026-08-27 12:43 JST 明确指令
# "GM 后台的服务器也应该是一个微服务的形式"
#
# dev 部署:用 hostPath 挂 binary(本机 cargo build --release -p gm-backend 产出)
# 待 gm-backend 镜像在 ghcr.io 推送后,改成 image: ghcr.io/...:0.1.0
#
# Ports(per RGS-ARC-005):
# - 8443 HTTPS(APIGW 入口,GM 浏览器/admin-web 客户端)
# - 8081 HTTP(k8s liveness/readiness,/healthz,/readyz)
# - 9464 metrics(Prometheus scrape)
#
# RBAC:NetworkPolicy 默认只允许 ingress 8443 from 任意(对外),
#       egress 限制到 admin-service:50055(mTLS 调 AdminService gRPC)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gm-backend
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: gm-backend
    app.kubernetes.io/component: gm-apigw
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: 0.1.0
    rust-game-server.io/role: external-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gm-backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gm-backend
        app.kubernetes.io/component: gm-apigw
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: 0.1.0
        rust-game-server.io/role: external-api-gateway
    spec:
      # 复用 rust-game-server 已有 ServiceAccount(per RBAC 模板)
      serviceAccountName: gm-backend-service-account
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gm-backend
        # 用推上 ghcr.io 的 0.1.0-gm-backend 镜像(distroless + 5917 字节 binary + entrypoint)
        # Per 2026-08-27 15:18 JST Actions 推送成功(workflow run 33047394103)
        image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-gm-backend
        imagePullPolicy: IfNotPresent
        command: ["/app/bin/gm-backend"]
        env:
        - name: RUST_LOG
          value: "info,gm-backend=debug"
        - name: GM_HTTP_ADDR
          value: "0.0.0.0:8443"
        - name: GM_HEALTH_ADDR
          value: "0.0.0.0:8081"
        - name: ADMIN_GRPC_ENDPOINT
          value: "http://admin-service:50055"
        - name: RGS_DOMAIN
          value: "gm-backend"
        - name: RGS_ALLOW_INSECURE_GRPC
          value: "0"
        - name: OTEL_SERVICE_NAME
          value: "gm-backend"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 9464
          protocol: TCP
        # 探针:HTTP /healthz /readyz(8081,k8s exec 不需要 grpc_health_probe)
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: gm-backend
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: gm-backend
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: gm-backend
    app.kubernetes.io/component: gm-apigw
    app.kubernetes.io/part-of: rust-game-server
spec:
  selector:
    app.kubernetes.io/name: gm-backend
  ports:
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
  - name: health
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: metrics
    port: 9464
    targetPort: 9464
    protocol: TCP
  type: ClusterIP
---
# ServiceAccount(若 RBAC 模板不允许自动 SA,则显式声明)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gm-backend-service-account
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: gm-backend
    app.kubernetes.io/part-of: rust-game-server
