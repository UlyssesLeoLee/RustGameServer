# 05-admin-service.yaml
# 角色：admin 域（含 COC 集群运营中心控制面）Deployment + Service
# 状态：🔴 NO-GO 占位
# 实际值写入条件：admin 域 Lead 具名签字（**COC 控制面属 admin 域独立控制面**，SRE 兼任会与 admin 域 Lead 责任重叠，per DEC-005）
# 关联：
#   - DTL-031 + SP-031 admin 域
#   - ARC-051 集群运营中心（COC）
#   - ARC-051 中心事件管理（CEM）
#   - ARC-051 每功能原子升级（PFAU）
# 副本数：1/1-2（低流量高权限，COC 控制面手操作密集）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_ADMIN_DEPLOY_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: coc-control-plane   # 关键标签 — COC 控制面
    app.kubernetes.io/part-of: rust-game-server
    rust-game-server.io/coc: "true"
spec:
  replicas: PLACEHOLDER_ADMIN_REPLICAS          # 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/component: coc-control-plane
        rust-game-server.io/coc: "true"
    spec:
      serviceAccountName: PLACEHOLDER_ADMIN_SA    # 单独 SA — 高权限，COC 操作
      containers:
        - name: admin
          image: PLACEHOLDER_ADMIN_IMAGE
          ports:
            - name: grpc
              containerPort: PLACEHOLDER_ADMIN_GRPC_PORT
            - name: coc-web
              containerPort: PLACEHOLDER_ADMIN_COC_WEB_PORT  # COC Web UI（仅内网）
            - name: metrics
              containerPort: PLACEHOLDER_ADMIN_METRICS_PORT
          env:
            - name: RUST_LOG
              value: PLACEHOLDER_ADMIN_LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: PLACEHOLDER_ADMIN_DB_SECRET
                  key: PLACEHOLDER_ADMIN_DB_KEY
            - name: COC_BIND_ADDR
              value: PLACEHOLDER_ADMIN_COC_BIND
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: PLACEHOLDER_OTEL_ENDPOINT
          resources:
            requests:
              cpu: PLACEHOLDER_ADMIN_CPU_REQ          # 250m
              memory: PLACEHOLDER_ADMIN_MEM_REQ       # 256Mi
            limits:
              cpu: PLACEHOLDER_ADMIN_CPU_LIM          # 1000m
              memory: PLACEHOLDER_ADMIN_MEM_LIM       # 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_ADMIN_SVC_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: grpc
      port: PLACEHOLDER_ADMIN_GRPC_PORT
      targetPort: PLACEHOLDER_ADMIN_GRPC_PORT
    - name: coc-web
      port: PLACEHOLDER_ADMIN_COC_WEB_PORT
      targetPort: PLACEHOLDER_ADMIN_COC_WEB_PORT
    - name: metrics
      port: PLACEHOLDER_ADMIN_METRICS_PORT
      targetPort: PLACEHOLDER_ADMIN_METRICS_PORT
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: PLACEHOLDER_ADMIN_HPA_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: PLACEHOLDER_ADMIN_DEPLOY_NAME
  minReplicas: PLACEHOLDER_ADMIN_HPA_MIN         # 1
  maxReplicas: PLACEHOLDER_ADMIN_HPA_MAX         # 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: PLACEHOLDER_ADMIN_CPU_TARGET
