# 55-gm-console-envoy-configmap.yaml
# 角色: gm-console 前端 envoy 边缘代理配置 (ConfigMap)
# 状态: 新增 (per 9/1 13:05 JST Ulysses 决策 — envoy 独立 deployment, 不挂 sidecar)
#
# 职责: 反向代理 /gm/* → gm-backend:8443 (APIGW, 鉴权 + SSE)
# 静态资源: 由 gm-backend 用 actix-files 一起 serve (per RGS-GM-CONSOLE-DEPLOY-2026-09-01-ENVOY_v0.1 §3.2)
#           不在 envoy 上配 file_system filter, 避免 wasm/lua 复杂度
# 不用 istio sidecar: per 9/1 13:05 JST 决策, envoy 走独立 deployment
#
# 关联:
#   - RGS-GM-CONSOLE-DEPLOY-2026-09-01-ENVOY_v0.1 (DDD Review 决策)
#   - 50-gm-backend-service.yaml (ClusterIP service, 反代目标)
#   - 56-gm-console-envoy-deployment.yaml (本 ConfigMap mount 到 envoy pod)
#   - 57-gm-console-envoy-service.yaml (ClusterIP service 暴露 envoy)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gm-console-envoy-config
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: gm-console-envoy
    app.kubernetes.io/component: gm-frontend
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: 0.1.0
    rust-game-server.io/role: edge-proxy
data:
  # envoy bootstrap 配置
  # per https://www.envoyproxy.io/docs/envoy/latest/configuration/overview/examples
  # 不使用 xDS, 全部 static_resources (跟 8 域其他 svc 同模式 — 配置即代码, 不依赖控制面)
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
      - name: gm_console_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: gm_console
              # 10s request timeout (gm-backend 500ms admin gRPC 失败时降级 InMemory)
              request_timeout: 10s
              # SSE 长连接 (per /gm/events) 需要关闭 buffer
              stream_idle_timeout: 0s
              route_config:
                name: gm_console_routes
                virtual_hosts:
                - name: gm_console
                  domains: ["*"]
                  cors:
                    allow_origin_string_match:
                    - safe_regex:
                        regex: ".*"
                    allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                    allow_headers: "authorization, content-type, x-requested-with"
                    expose_headers: "x-request-id, x-trace-id"
                    max_age: "3600"
                    allow_credentials: true
                  routes:
                  # 1) /gm/* 反代到 gm-backend:8443 (actix-web APIGW)
                  - match:
                      prefix: "/gm"
                    route:
                      cluster: gm_backend
                      timeout: 30s
                      retry_policy:
                        retry_on: "5xx,reset,connect-failure"
                        num_retries: 2
                        per_try_timeout: 5s
                      # SSE 流不走 retry (避免重复连接)
                      retry_policy: ~
                    request_headers_timeout: 5s
                  # 2) 静态资源 /assets/* 反代到 gm-backend:8080 (actix-files serve dist/)
                  - match:
                      prefix: "/assets"
                    route:
                      cluster: gm_backend_static
                      timeout: 10s
                  # 3) SPA index.html — fallback 到 gm-backend:8080
                  - match:
                      prefix: "/"
                    route:
                      cluster: gm_backend_static
                      timeout: 10s
              http_filters:
              # 1) envoy.filters.http.cors — 必须先于 router
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              # 2) envoy.filters.http.router — 必须最后
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: gm_backend
        # STRICT_DNS: 通过 k8s service DNS name 解析 (gm-backend.rust-game-server.svc.cluster.local)
        type: STRICT_DNS
        connect_timeout: 1s
        # HTTP/2 (gm-backend 现在是 HTTP/1.1, 待 mTLS 启用时切 HTTP/2)
        # 待 GM_REQUIRE_JWT=true + mTLS 启用后, 这里改 transport_socket
        load_assignment:
          cluster_name: gm_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: gm-backend
                    port_value: 8443
        health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/healthz"
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 50
            max_requests: 200
            max_retries: 3
      - name: gm_backend_static
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: gm_backend_static
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: gm-backend
                    port_value: 8080
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 50
            max_pending_requests: 25
            max_requests: 100
    # 内部 prometheus metrics (per RGS-ARC-051 可观测性事件管理)
    stats_sinks:
    - name: envoy.stat_sinks.metrics_service
      typed_config:
        "@type": type.googleapis.com/envoy.config.metrics.v3.MetricsServiceConfig
        transport_api_version: V3
        grpc_service:
          envoy_grpc:
            cluster_name: otel_collector
        report_counters_as_deltas: true
    # 兼容未来加 xDS (现不用, 但保留 extensions 启用统计)
    layered_runtime:
      layers:
      - name: static_layer
        static_layer:
          envoy:
            resource_limits:
              listener:
                example_listener_name:
                  connection_limit: 1000
