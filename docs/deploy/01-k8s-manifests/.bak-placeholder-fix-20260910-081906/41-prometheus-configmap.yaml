# 41-prometheus-configmap.yaml
# 角色：Prometheus 配置（从 docker/observability/prometheus.yml 移植）
# 关联：
#   - RGS-DTL-100 §7 可观测性
#   - docker/observability/prometheus.yml 源文件
# 变更点（vs docker-compose 版本）：
#   - targets 改为 K8s Service DNS（prometheus / otel-collector 走同 namespace Service）
#   - 新增 rgs-services 抓 5 业务域（直接 scrape /metrics，与 OTel 互补：OTel 走 OTLP 上报，Prom 直抓兜底）
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: rust-game-server
data:
  prometheus.yml: |
    # Prometheus 配置（per RGS-DTL-100 §7 + ARC-051 CEM）
    # scrape 5 域 + cluster-ops /metrics + OTel Collector 内部 metrics

    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: rgs-dev

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.rust-game-server.svc.cluster.local:8889"]

      - job_name: rgs-services
        static_configs:
          - targets:
              - "player-service.rust-game-server.svc.cluster.local:50051"
              - "economy-service.rust-game-server.svc.cluster.local:50052"
              - "match-service.rust-game-server.svc.cluster.local:50053"
              - "social-service.rust-game-server.svc.cluster.local:50054"
              - "admin-service.rust-game-server.svc.cluster.local:50055"
              - "cluster-ops-service.rust-game-server.svc.cluster.local:50056"
        metrics_path: /metrics
