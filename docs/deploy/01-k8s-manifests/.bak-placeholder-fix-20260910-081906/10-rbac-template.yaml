# ==================== admin 域（COC 控制面）— 高权限 ====================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-role
  namespace: rust-game-server
rules:
  # admin 域可访问所有域 configmap（**只读**，COC 监控需要）
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["rgs-config", "admin-config", "admin-db-secret", "rgs-tls-admin", "rgs-ca", "coc-ops-secret"]
    verbs: ["get", "watch", "list"]
  # admin 域可对其他 5 域 configmap 只读
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["player-config", "economy-config", "match-config", "social-config"]
    verbs: ["get", "watch", "list"]
  # COC 监控需读 pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-role-binding
  namespace: rust-game-server
subjects:
  - kind: ServiceAccount
    name: admin-service-account
    namespace: rust-game-server
roleRef:
  kind: Role
  name: admin-role
  apiGroup: rbac.authorization.k8s.io
---
# ==================== cluster-ops 域（Active-Active 跨节点调谐，per ADR-0052）====================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-ops-role
  namespace: rust-game-server
rules:
  # cluster-ops 可读所有 configmap（PFAU 操作需要）
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "watch", "list"]
  # PFAU 操作需要 patch deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "watch", "list", "patch"]
  # 节点异常时调谐需要
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "watch", "list"]
  # 调整 PDB
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-ops-role-binding
  namespace: rust-game-server
subjects:
  - kind: ServiceAccount
    name: cluster-ops-service-account
    namespace: rust-game-server
roleRef:
  kind: Role
  name: cluster-ops-role
  apiGroup: rbac.authorization.k8s.io
---
# ==================== shared-platform（OTel collector）====================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-platform-role
  namespace: rust-game-server
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["rgs-config", "otel-collector-config"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-platform-role-binding
  namespace: rust-game-server
subjects:
  - kind: ServiceAccount
    name: shared-platform-service-account
    namespace: rust-game-server
roleRef:
  kind: Role
  name: shared-platform-role
  apiGroup: rbac.authorization.k8s.io
