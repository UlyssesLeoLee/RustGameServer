# 10-rbac-template.yaml
# 角色：ServiceAccount + Role + RoleBinding（5 域 + cluster-ops + shared-platform + postgres）
# 状态：🟢 NO-GO 解除后实际值落地（per RGS-DEC-NOGO-001 + DEC-008 12 角色签字 2026-08-24）
# 实际值校准：
#   - SRE 具名：Ulysses（per DEC-008 兼任）
#   - Platform 架构师：Ulysses（per DEC-008 兼任）
# 重要约束（per ARC-008 + DEC-005 + ADR-0052）：
#   - 5 域共用 namespace，**通过 RBAC + NetworkPolicy 隔离**
#   - cluster-ops 域独立 SA（Active-Active 跨节点调谐权限，per ADR-0052）
#   - admin 域独立 SA（COC 控制面高权限）
#   - **5 域 Lead 不享有"代表同意"机制** — 任一域 Lead 异议即该域 Blocker（per DEC-005 延伸）
---
# ==================== player 域 ====================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: player-role
  namespace: rust-game-server
rules:
  # player 域 pod 只读访问自身 configmap / secret（不允许访问其他域资源）
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["player-config", "rgs-config", "player-db-secret", "rgs-tls-player", "rgs-ca"]
    verbs: ["get", "watch", "list"]
  # 业务域 pods 自身查询
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: player-role-binding
  namespace: rust-game-server
subjects:
  - kind: ServiceAccount
    name: player-service-account
    namespace: rust-game-server
roleRef:
  kind: Role
  name: player-role
  apiGroup: rbac.authorization.k8s.io
---
