# -----------------------------------------------------------------------
# L4-5: HPA 行为配置总结 (stabilizationWindow + policies + selectPolicy)
# -----------------------------------------------------------------------
# 通用规则 (per 8/31 ST 经验 + 9/1 SRE 拍板):
#
# stabilizationWindow:
#   - scaleDown: 5min (300s) 防抖动, 让负载稳定后再缩容
#     * network-gateway 例外: 10min (600s) 因 Erlang/OTP 启动慢
#   - scaleUp: 0s (立即扩容) — 业务域高可用优先
#
# policies:
#   - scaleDown Percent 50% / 60s (业务域), 100% / 60s (batch/mgmt)
#   - scaleUp Percent 100% / 30s OR Pods 2 / 30s, selectPolicy=Max
#   - 业务域 scaleUp 双策略: Percent 100% (按当前副本数翻倍) + Pods 2 (至少 +2)
#   - batch/mgmt scaleUp 单策略: Percent 100% (按当前副本数翻倍)
#
# selectPolicy:
#   - scaleUp: Max (激进, 选最大策略)
#   - scaleDown: Min (保守, 选最小策略)
#
# metrics:
#   - 业务域 / 3 NEW 域 / 工具 svc: CPU 70% + memory 75% 双指标
#   - batch: CPU 70% 单指标 (memory spike 正常, 任务突发)
#
# 已知缺口 (per 9/1 WBS v0.2 E4 §"缺标比错标"):
#   - metrics-server 未在 k3s 集群上验证 (per 9/1 集群状态: kubectl top 不可用)
#     HPA 模板就位, 但需 metrics-server 安装后才能真正生效
#   - 5 域 yaml 现有 HPA (maxReplicas=8) 与本模板 (maxReplicas=5) 不一致
#     9/15 deadline 前不直接改 01-05 yaml, 留待 SRE 单独派工收敛
#   - rgs-web 暂用 gm-console 同档 (per E4 任务 2 L4-4)
#   - 工具 svc 流量低, HPA 实际不会触发, 模板覆盖即可
# -----------------------------------------------------------------------

