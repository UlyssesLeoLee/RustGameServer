# -----------------------------------------------------------------------
# L4-2: batch svc HPA (rgs-batch-console / rgs-batch-backend / rgs-batch-envoy)
# -----------------------------------------------------------------------
# 模板: minReplicas=1, maxReplicas=3 (per E4 公式 4: peak 100 / single 50 × 1.5)
# 触发: CPU 70% (沿用), 不监控 memory (batch 任务突发型, memory spike 正常)
# 行为: scaleDown 5min + 100% Percent / 60s (激进缩容, 任务完成立刻释放)
#       scaleUp 0s + 100% Percent / 30s (激进扩容, 任务积压立刻扩)
#
# 已知缺口: rgs-batch-backend 单进程 + tokio multi-thread runtime (per AGENTS.md §7 派生约束 8)
#   1 写者约束, HPA 多实例会有 task 抢占, 需要 leader election 或 distributed lock
#   Phase C 接入前 HPA 模板只覆盖, 不强 enforce max=3
# -----------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rgs-batch-console-hpa
  namespace: rgs-batch
  labels:
    app.kubernetes.io/name: rgs-batch-console
    rgs.io/e4-isolation: phase-c
    rgs.io/target-domain: batch
    rgs.io/template: e4-2026-09-08
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rgs-batch-console
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rgs-batch-backend-hpa
