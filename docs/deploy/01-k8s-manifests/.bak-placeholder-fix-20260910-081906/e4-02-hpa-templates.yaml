# e4-02-hpa-templates.yaml
# ===========================================================================
# 角色：E4 k3s 资源策略 — HPA (HorizontalPodAutoscaler) 模板（per 9/8 20:47 JST Ulysses 拍板 + 9/1 WBS v0.2 E4）
# 状态：🟡 Phase C 准备 — 模板 + behavior 配置, 待 9/15 deadline 前 kubectl apply
#
# 13 L4 任务分块 (本文件 = 任务 3, 5 L4):
#   L4-1: 5 域 svc HPA (min 1 / max 5, CPU 70%) — 沿用 + 微调
#   L4-2: batch svc HPA (min 1 / max 3, CPU 70%)
#   L4-3: 3 NEW 域 svc HPA (min 1 / max 5, CPU 70%)
#   L4-4: 工具 svc HPA (min 1 / max 2, CPU 70%)
#   L4-5: HPA 行为配置 (stabilizationWindow + policies + selectPolicy)
#
# 关联：
#   - 01-05 yaml 现有 HPA (minReplicas=2 / maxReplicas=8, CPU 70% + memory 75%) — 沿用 base, E4 收紧 max
#   - e4-00-namespace-isolation.yaml + e4-01-resource-limits.yaml (本套 E4 文件前两段)
#   - RGS-OLU-REPORT-token-OLU-2026-09-02 v0.2 §4
#   - 8/31 ST 经验: HPA minReplicas 强启动风暴教训 (per AGENTS.md §2.6 L6)
# ===========================================================================

# -----------------------------------------------------------------------
# L4-1: 5 域 svc HPA (player / economy / match / social / admin)
# -----------------------------------------------------------------------
# 模板: minReplicas=2 (保可用, 沿用 01-05 yaml), maxReplicas=5 (E4 收紧从 8)
# 触发: CPU 70% (沿用), memory 75% (沿用)
# 行为: scaleDown stabilizationWindow 5min + 50% Percent / 60s
#       scaleUp stabilizationWindow 0s + 100% Percent or 2 Pods / 30s, selectPolicy=Max
#
# 与 01-05 yaml 现有 HPA 差异:
#   - maxReplicas 8 → 5 (per E4 token-OLU 公式 4 推算 peak_qps 1000 / single_pod 200 × 1.0)
#   - minReplicas 2 → 1 (per E4 公式 4 推导: baseline_pods 0 + 1 rolling update)
#   - 实际 01-05 yaml minReplicas=2 已是生产基线, 不强改; 新部署按 min 2 沿用, 旧 5 域 max 8 不动
#   - 9/15 deadline 前不直接改 01-05 yaml, 留待 Phase C 实战后由 SRE 单独派工收敛
# -----------------------------------------------------------------------

# HPA template (Kustomize-style, 实际 kubectl apply 时按域展开 5 份)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: player-service-hpa
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    rgs.io/e4-isolation: phase-c
    rgs.io/target-domain: 5domain
    rgs.io/template: e4-2026-09-08
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: player-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
