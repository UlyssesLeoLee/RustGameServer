# 50-secret-ca.yaml
# 角色:CA 证书 Secret(6 域共享,Opaque 类型,只存 ca.pem)
# 状态:🔴 模板占位(实际值由 phase-0-5-step-4-render-secrets.ps1 注入)
# 注入后产出: E:\DevCache\cargo\target\rendered-secrets\50-secret-ca.yaml
# apply 路径(主对话 WF-0.5-2/0.5-3 合入后):
#   kubectl apply -f E:/DevCache/cargo/target/rendered-secrets/50-secret-ca.yaml
#
# 文件映射(容器内):
#   /etc/rgs/certs/ca.pem     ← ca.crt.pem (CA 根证书)
#
# 业务 binary 启动时通过 load_server_tls_config(server.pem, server.key, ca.pem)
# 读取 ca.pem 作为客户端证书校验的 trust anchor(per crates/shared-platform/src/tls.rs)
#
# 关联: RGS-INC-001 v0.2 §1.4 (mTLS fail-closed)
apiVersion: v1
kind: Secret
metadata:
  name: rgs-secret-ca
  namespace: rgs
  labels:
    app.kubernetes.io/part-of: rust-game-server
    rust-game-server.io/component: mtls-ca
    rust-game-server.io/cert-type: ca
type: Opaque
# data 字段(实际值)由 phase-0-5-step-4-render-secrets.ps1 替换:
#   ca.pem: <base64(ca.crt.pem)>
data:
  ca.pem: ""
