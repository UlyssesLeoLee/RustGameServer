# 50-secret-player-tls.yaml
# 角色:player 域 server 证书 + 私钥 Secret(kubernetes.io/tls)
# 状态:🔴 模板占位(实际值由 phase-0-5-step-4-render-secrets.ps1 注入)
# 注入后产出: E:\DevCache\cargo\target\rendered-secrets\50-secret-player-tls.yaml
# apply 路径(主对话 WF-0.5-2/0.5-3 合入后):
#   kubectl apply -f E:/DevCache/cargo/target/rendered-secrets/50-secret-player-tls.yaml
#
# 文件映射(容器内,通过 50-secret-* volumes 挂载到 /etc/rgs/certs/):
#   /etc/rgs/certs/server.pem  ← tls.crt (player.service.crt.pem)
#   /etc/rgs/certs/server.key  ← tls.key (player.service.key.pem)
#   /etc/rgs/certs/ca.pem      ← 来自 rgs-secret-ca(独立 mount)
#
# 业务 binary 启动时读 RGS_TLS_DIR=/etc/rgs/certs + load_server_tls_config(server.pem, server.key, ca.pem)
# 缺失任一文件 → anyhow Context 上抛 → main 返 Err → 进程退 1 (fail-closed)
#
# 关联: RGS-INC-001 v0.2 §1.4 (mTLS fail-closed) + 55.21 wire-up
apiVersion: v1
kind: Secret
metadata:
  name: rgs-secret-player-tls
  namespace: rgs
  labels:
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/name: player
    app.kubernetes.io/component: domain-service
    rust-game-server.io/cert-type: mtls-server
type: kubernetes.io/tls
# data 字段(实际值)由 phase-0-5-step-4-render-secrets.ps1 替换:
#   tls.crt: <base64(player.service.crt.pem)>
#   tls.key: <base64(player.service.key.pem)>
stringData:
  tls.crt: "REPLACE_BEFORE_DEPLOY_PLAYER_TLS_CRT"
  tls.key: "REPLACE_BEFORE_DEPLOY_PLAYER_TLS_KEY"
