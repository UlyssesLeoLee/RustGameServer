# 50-secret-cluster-ops-tls.yaml
# 角色:cluster-ops service server 证书 + 私钥 Secret(kubernetes.io/tls)
# 状态:🔴 模板占位(实际值由 phase-0-5-step-4-render-secrets.ps1 注入)
# 注入后产出: E:\DevCache\cargo\target\rendered-secrets\50-secret-cluster-ops-tls.yaml
# apply 路径(主对话 WF-0.5-2/0.5-3 合入后):
#   kubectl apply -f E:/DevCache/cargo/target/rendered-secrets/50-secret-cluster-ops-tls.yaml
#
# 文件映射(容器内,通过 50-secret-* volumes 挂载到 /etc/rgs/certs/):
#   /etc/rgs/certs/server.pem  ← tls.crt (cluster-ops.service.crt.pem)
#   /etc/rgs/certs/server.key  ← tls.key (cluster-ops.service.key.pem)
#   /etc/rgs/certs/ca.pem      ← 来自 rgs-secret-ca(独立 mount)
#
# 关联: RGS-INC-001 v0.2 §1.4 (mTLS fail-closed) + 55.21 wire-up
# 注意: cluster-ops 是 Active-Active 部署(per ADR-0052),所有副本共享同一 server cert
#       (证书内不含副本标识;副本区分由 K8s StatefulSet/Headless Service 负责)
apiVersion: v1
kind: Secret
metadata:
  name: rgs-secret-cluster-ops-tls
  namespace: rgs
  labels:
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/name: cluster-ops
    app.kubernetes.io/component: control-plane
    rust-game-server.io/cert-type: mtls-server
    rust-game-server.io/active-active: "true"
type: kubernetes.io/tls
# data 字段(实际值)由 phase-0-5-step-4-render-secrets.ps1 替换:
#   tls.crt: <base64(cluster-ops.service.crt.pem)>
#   tls.key: <base64(cluster-ops.service.key.pem)>
data:
  tls.crt: "REPLACE_BEFORE_DEPLOY_CLUSTER_OPS_TLS_CRT"
  tls.key: "REPLACE_BEFORE_DEPLOY_CLUSTER_OPS_TLS_KEY"
