# 08-configmap-template.yaml
# 角色：ConfigMap 模板（含 5 域配置 + CEM topic 路由 + OTel exporter 配置）
# 状态：🔴 NO-GO 占位
# 实际值写入条件：5 域 Lead 联合校准 + Platform 架构师审批
# 关联：
#   - ARC-051 CEM（中心事件管理）topic 路由
#   - ARC-008 5 独立 DB 拓扑
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER_RGS_CONFIG_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/part-of: rust-game-server
data:
  # 5 域 gRPC endpoint（DNS 形式，Service 名称由 01-06 Service yaml 决定）
  RGS_PLAYER_GRPC_ENDPOINT: "PLACEHOLDER_PLAYER_SVC_NAME:PLACEHOLDER_PLAYER_GRPC_PORT"
  RGS_ECONOMY_GRPC_ENDPOINT: "PLACEHOLDER_ECONOMY_SVC_NAME:PLACEHOLDER_ECONOMY_GRPC_PORT"
  RGS_MATCH_GRPC_ENDPOINT: "PLACEHOLDER_MATCH_SVC_NAME:PLACEHOLDER_MATCH_GRPC_PORT"
  RGS_SOCIAL_GRPC_ENDPOINT: "PLACEHOLDER_SOCIAL_SVC_NAME:PLACEHOLDER_SOCIAL_GRPC_PORT"
  RGS_ADMIN_GRPC_ENDPOINT: "PLACEHOLDER_ADMIN_SVC_NAME:PLACEHOLDER_ADMIN_GRPC_PORT"
  RGS_CLUSTER_OPS_GRPC_ENDPOINT: "PLACEHOLDER_CLUSTER_OPS_SVC_NAME:PLACEHOLDER_CLUSTER_OPS_GRPC_PORT"

  # CEM（中心事件管理）topic 路由
  # per ARC-051：所有 5 域事件统一通过 CEM 转发
  CEM_TOPIC_PLAYER_EVENTS: "PLACEHOLDER_CEM_PLAYER_TOPIC"
  CEM_TOPIC_ECONOMY_EVENTS: "PLACEHOLDER_CEM_ECONOMY_TOPIC"
  CEM_TOPIC_MATCH_EVENTS: "PLACEHOLDER_CEM_MATCH_TOPIC"
  CEM_TOPIC_SOCIAL_EVENTS: "PLACEHOLDER_CEM_SOCIAL_TOPIC"
  CEM_TOPIC_ADMIN_EVENTS: "PLACEHOLDER_CEM_ADMIN_TOPIC"
  CEM_TOPIC_PFAU_OPS: "PLACEHOLDER_CEM_PFAU_OPS_TOPIC"

  # OTel exporter 端点
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://PLACEHOLDER_OTEL_COLLECTOR_SVC_NAME:PLACEHOLDER_OTEL_OTLP_GRPC_PORT"
  OTEL_SERVICE_NAME: "rust-game-server"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=rust-game-server,deployment.environment=PLACEHOLDER_ENV"

  # PFAU（每功能原子升级）配置
  PFAU_ATOMIC_TIMEOUT_SEC: "PLACEHOLDER_PFAU_ATOMIC_TIMEOUT"     # 实际值待定
  PFAU_ROLLBACK_TIMEOUT_SEC: "PLACEHOLDER_PFAU_ROLLBACK_TIMEOUT" # 实际值待定
  PFAU_REACHABILITY_MODE: "all-reachable"                        # per ADR-0052

  # Rhai 沙箱脚本路径（per ARC-020：拒动态库加载，仅 Rhai）
  RHAI_SCRIPT_PATH: "PLACEHOLDER_RHAI_SCRIPT_PATH"

  # 日志级别（per RGS-IMPL-001）
  RUST_LOG: "info,sqlx=warn,tonic=warn,quinn=warn"
---
# 5 域各自 ConfigMap — 域内配置（限流、缓存、路由等）
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER_PLAYER_CONFIG_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: player
data:
  PLAYER_SESSION_TTL_SEC: "PLACEHOLDER_PLAYER_SESSION_TTL"
  PLAYER_CACHE_SIZE: "PLACEHOLDER_PLAYER_CACHE_SIZE"
  PLAYER_RATE_LIMIT_RPS: "PLACEHOLDER_PLAYER_RATE_LIMIT"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER_ECONOMY_CONFIG_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: economy
    rust-game-server.io/saga-critical: "true"
data:
  ECONOMY_SAGA_TIMEOUT_SEC: "PLACEHOLDER_ECONOMY_SAGA_TIMEOUT"
  ECONOMY_TX_RETRY_MAX: "PLACEHOLDER_ECONOMY_TX_RETRY"
  ECONOMY_CURRENCY_DECIMALS: "PLACEHOLDER_ECONOMY_CURRENCY_DECIMALS"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER_MATCH_CONFIG_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: match
data:
  MATCH_QUEUE_TIMEOUT_SEC: "PLACEHOLDER_MATCH_QUEUE_TIMEOUT"
  MATCH_TICK_RATE_HZ: "PLACEHOLDER_MATCH_TICK_RATE"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER_SOCIAL_CONFIG_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: social
data:
  SOCIAL_FRIEND_LIST_CACHE_TTL_SEC: "PLACEHOLDER_SOCIAL_FRIEND_TTL"
  SOCIAL_MESSAGE_BATCH_SIZE: "PLACEHOLDER_SOCIAL_MSG_BATCH"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER_ADMIN_CONFIG_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: admin
    rust-game-server.io/coc: "true"
data:
  ADMIN_AUDIT_LOG_RETENTION_DAYS: "PLACEHOLDER_ADMIN_AUDIT_RETENTION"
  COC_OPERATOR_REQUIRE_MFA: "PLACEHOLDER_COC_MFA_REQUIRED"
  PFAU_CONFIRM_DUAL_OPERATOR: "PLACEHOLDER_PFAU_DUAL_CONFIRM"
