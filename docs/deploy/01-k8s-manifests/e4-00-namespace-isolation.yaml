# 关联：
#   - 00-namespace.yaml (旧单一 namespace + ResourceQuota — 沿用基础 deny-all NetworkPolicy)
#   - RGS-K3S-CLUSTER-STATUS-2026-09-02_v0.1.md (k3s 现状 baseline)
#   - RGS-PHASE-C-MAVIS-PHASE-A-2026-09-03_v0.1.md (E4 范围)
