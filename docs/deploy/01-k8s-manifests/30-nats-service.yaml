# 30-nats-service.yaml
# 角色：NATS JetStream Service 集
#   - Headless Service：StatefulSet 内部 DNS 寻址（nats-0.nats-headless.rgs.svc.cluster.local）
#   - ClusterIP Service：业务域访问（nats.rgs.svc.cluster.local:4222 client / 8222 monitoring）
# 关联：
#   - RGS-DTL-100 §5 消息总线
#   - RGS-SPEC-CROSS-005 §2 NATS Stream 命名约定
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: rgs
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: message-bus
    app.kubernetes.io/part-of: rust-game-server
spec:
  type: ClusterIP
  clusterIP: None  # Headless: DNS A 记录直接指向 Pod IP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: cluster
      port: 6222
      targetPort: 6222
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: rgs
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: message-bus
    app.kubernetes.io/part-of: rust-game-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitoring
      port: 8222
      targetPort: 8222
      protocol: TCP
