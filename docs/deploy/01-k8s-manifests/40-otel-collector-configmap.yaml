# 40-otel-collector-configmap.yaml
# 角色：OTel Collector 配置（从 docker/observability/otel-collector-config.yaml 移植）
# 关联：
#   - RGS-DTL-100 §7 可观测性
#   - ARC-051 CEM 中心事件管理
#   - docker/observability/otel-collector-config.yaml 源文件
# 设计：
#   - receivers: OTLP gRPC:4317 + OTLP HTTP:4318 + Prometheus scrape 5 域 /metrics
#   - exporters: Prometheus exporter 8889（供 Prometheus 反向抓取）+ debug
#   - pipelines: traces / metrics / logs
# 变更点（vs docker-compose 版本）：
#   - prometheus receiver 的 targets 改为 K8s Service DNS（player-service.rgs.svc.cluster.local:50051 等）
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: rgs
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: rust-game-server
data:
  otel-collector-config.yaml: |
    # OTel Collector 配置（per RGS-DTL-100 §7 + ARC-051 CEM）
    # 接收 5 域 gRPC OTLP + 导出到 Prometheus + 调试输出

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'rgs-services'
              scrape_interval: 15s
              static_configs:
                - targets:
                    - player-service.rgs.svc.cluster.local:50051
                    - economy-service.rgs.svc.cluster.local:50052
                    - match-service.rgs.svc.cluster.local:50053
                    - social-service.rgs.svc.cluster.local:50054
                    - admin-service.rgs.svc.cluster.local:50055
                    - cluster-ops-service.rgs.svc.cluster.local:50056
              metrics_path: /metrics

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: rgs
        const_labels:
          cluster: rgs-dev

      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
