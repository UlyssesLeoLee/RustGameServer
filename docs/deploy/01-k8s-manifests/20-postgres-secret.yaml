# 20-postgres-secret.yaml
# 角色：PostgreSQL 18.6 超级用户密码 + 5 域 DB 用户凭证（per ARC-008 5 独立 DB 原则）
# 状态：🔴 NO-GO 占位（per RGS-EXEC-001 v0.3）
# 实际值写入条件：SRE 具名 + 加密仓管理（**严禁明文提交到 git**）
# 实际部署：
#   kubectl apply -f 20-postgres-secret.yaml -n rust-game-server
# 实际值由 sealed-secrets / external-secrets 注入（DBA + SRE 联合生成）
# 关联：
#   - RGS-IMPL-001 §3.4 Secret 管理
#   - RGS-TS-001 v0.6 §5.2 PostgreSQL 18.4 / 18.6 选型
#   - ARC-008 5 独立 DB 原则
#   - ADR-0052 cluster_ops_db 独立（Active-Active 跨节点调谐）
---
# 超级用户（postgres）密码 — 实际值：REPLACE_BEFORE_DEPLOY（k3s apply 前由 sealed-secrets 替换）
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser  # 实际值：postgres-superuser
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: rust-game-server
    rust-game-server.io/tier: data
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ulysses_local"
  POSTGRES_USER: "postgres"
---
# 5 域 DB 用户凭证（player / economy / match / social / admin）+ cluster_ops
# 实际值：每个 DB 一个用户 + 各自密码（REPLACE_BEFORE_DEPLOY_*）
apiVersion: v1
kind: Secret
metadata:
  name: player-db-credentials  # 实际值：player-db-credentials
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/component: database
    rust-game-server.io/domain: player
type: Opaque
stringData:
  username: "player_user"
  password: "ulysses_local"
  database: "player_db"
  url: "postgres://player_user:ulysses_local@postgres:5432/player_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: economy-db-credentials
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: economy
    app.kubernetes.io/component: database
    rust-game-server.io/domain: economy
    rust-game-server.io/saga-critical: "true"
type: Opaque
stringData:
  username: "economy_user"
  password: "ulysses_local"
  database: "economy_db"
  url: "postgres://economy_user:ulysses_local@postgres:5432/economy_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: match-db-credentials
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: match
    app.kubernetes.io/component: database
    rust-game-server.io/domain: match
type: Opaque
stringData:
  username: "match_user"
  password: "ulysses_local"
  database: "match_db"
  url: "postgres://match_user:ulysses_local@postgres:5432/match_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: social-db-credentials
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: database
    rust-game-server.io/domain: social
type: Opaque
stringData:
  username: "social_user"
  password: "ulysses_local"
  database: "social_db"
  url: "postgres://social_user:ulysses_local@postgres:5432/social_db"
