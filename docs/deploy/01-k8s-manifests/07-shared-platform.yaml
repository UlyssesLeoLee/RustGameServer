# 07-shared-platform.yaml
# 角色：shared-platform（QUIC edge / gRPC ingress / OTel collector / 共享 sidecar）
# 状态：🔴 NO-GO 占位
# 实际值写入条件：Platform 架构师具名签字 + SRE 联合
# 关联：
#   - RGS-TS-001 §5.4 quinn QUIC 选型
#   - RGS-TS-001 §5.3 tonic gRPC 选型
#   - RGS-TS-001 §5.8 OpenTelemetry 选型
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_QUIC_EDGE_DEPLOY_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: quic-edge
    app.kubernetes.io/component: shared-platform
    app.kubernetes.io/part-of: rust-game-server
spec:
  replicas: PLACEHOLDER_QUIC_EDGE_REPLICAS       # 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quic-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quic-edge
    spec:
      serviceAccountName: PLACEHOLDER_SHARED_PLATFORM_SA
      containers:
        - name: quic-edge
          image: PLACEHOLDER_QUIC_EDGE_IMAGE
          ports:
            - name: quic
              containerPort: PLACEHOLDER_QUIC_EDGE_PORT
              protocol: UDP
            - name: metrics
              containerPort: PLACEHOLDER_QUIC_EDGE_METRICS_PORT
          env:
            - name: RUST_LOG
              value: PLACEHOLDER_QUIC_EDGE_LOG_LEVEL
            - name: QUIC_TLS_CERT_PATH
              value: PLACEHOLDER_QUIC_TLS_CERT_PATH
            - name: QUIC_TLS_KEY_PATH
              value: PLACEHOLDER_QUIC_TLS_KEY_PATH
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: PLACEHOLDER_OTEL_ENDPOINT
          resources:
            requests:
              cpu: PLACEHOLDER_QUIC_EDGE_CPU_REQ
              memory: PLACEHOLDER_QUIC_EDGE_MEM_REQ
            limits:
              cpu: PLACEHOLDER_QUIC_EDGE_CPU_LIM
              memory: PLACEHOLDER_QUIC_EDGE_MEM_LIM
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_QUIC_EDGE_SVC_NAME
  namespace: PLACEHOLDER_NAMESPACE
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: quic-edge
  ports:
    - name: quic
      port: PLACEHOLDER_QUIC_EDGE_PORT
      targetPort: PLACEHOLDER_QUIC_EDGE_PORT
      protocol: UDP
    - name: metrics
      port: PLACEHOLDER_QUIC_EDGE_METRICS_PORT
      targetPort: PLACEHOLDER_QUIC_EDGE_METRICS_PORT
---
# OTel Collector — 共享 sidecar 形式或独立 Deployment
# 实际拓扑由 Platform 架构师 + SRE 决定
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_OTEL_COLLECTOR_DEPLOY_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: shared-platform
spec:
  replicas: PLACEHOLDER_OTEL_COLLECTOR_REPLICAS
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: PLACEHOLDER_OTEL_COLLECTOR_IMAGE
          ports:
            - name: otlp-grpc
              containerPort: PLACEHOLDER_OTEL_OTLP_GRPC_PORT
            - name: otlp-http
              containerPort: PLACEHOLDER_OTEL_OTLP_HTTP_PORT
          resources:
            requests:
              cpu: PLACEHOLDER_OTEL_CPU_REQ
              memory: PLACEHOLDER_OTEL_MEM_REQ
            limits:
              cpu: PLACEHOLDER_OTEL_CPU_LIM
              memory: PLACEHOLDER_OTEL_MEM_LIM
