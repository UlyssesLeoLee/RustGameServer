# 21-postgres-pvc.yaml
# 角色：PostgreSQL 18.6 数据持久化（PVC + StorageClass）
# 状态：🔴 NO-GO 占位
# 实际值写入条件：SRE + DBA 联合确认存储策略（local-path / NFS / CSI）
# 关联：
#   - RGS-TS-001 v0.6 §5.2 PostgreSQL 18.4 / 18.6 选型
#   - RGS-IMPL-001 §3.5 存储
#   - RGS-SPEC-CROSS-005 §1 数据库命名约定
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: PLACEHOLDER_POSTGRES_PVC_NAME  # 实际值：postgres-data-pvc
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: rust-game-server
    rust-game-server.io/tier: data
spec:
  accessModes:
    - ReadWriteOnce           # 单节点 PG 实例，单读写
  storageClassName: PLACEHOLDER_POSTGRES_STORAGE_CLASS  # 实际值：local-path（k3s 默认） 或 rancher-local-path
  resources:
    requests:
      storage: PLACEHOLDER_POSTGRES_STORAGE_SIZE  # 实际值：5Gi（dev 单实例）；prod 视业务量
  volumeMode: Filesystem
