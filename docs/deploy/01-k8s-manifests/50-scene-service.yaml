# 50-scene-service.yaml
# 角色: scene 域 NEW (Phase 2 子系统, 148 RPC, 8-12 SRE·d) Deployment + Service + HPA + PDB + ServiceAccount
# 状态: 🟡 占位 — Phase 1.5 k8s yaml 落档, 不真 apply (per W20 brief 4 "不真 apply 仅落 docs + cert 模拟")
# 真实部署: Phase 4 灰度前 SRE Lead 推 image `0.1.0-scene-service` + apply
# 关联:
#   - W4 commit 57edbeb (crates/scene-service 148 RPC scaffold)
#   - 改进路线图 §1 Phase 2 (scene + 移动 148 RPC, 8-12 SRE·d)
#   - RGS-BATCH-REQUIREMENTS-2026-09-01 v0.1 (DB 三分类, scene schema 划分 scene_master/scene_transaction/scene_work)
#   - 7 域独立 Lead (per 8/21 JST 5 域拒绝兼任 → 扩 7 域)
#   - AGENTS.md §2.6 D3 commit 模板 + L11/L12 PT 派工约束
#   - ca-sbn.pem 是 Phase 1.5 临时 mini-CA (2026-09-05 抽), 5 域 ca.pem 是 rgs-certgen 生成
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scene-service-account
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
    rust-game-server.io/domain: scene
    rust-game-server.io/phase: "1.5-placeholder"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: "0.1.0-scene-service"
    rust-game-server.io/domain: scene
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene
        app.kubernetes.io/component: domain-service
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: "0.1.0-scene-service"
        rust-game-server.io/domain: scene
    spec:
      serviceAccountName: scene-service-account
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scene
          # Phase 1.5 占位 image tag, 真实推送等 Phase 4 SRE Lead 协调
          image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-scene-service
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/scene-service"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: 50057
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,scene-service=debug,sqlx=warn,tonic=warn"
            # Phase 1.5 端口规划: scene 50057 (5 域用 50051-50056, cluster_ops 50057 是历史值, 此处 scene 单独 50057)
            # 实际: scene main.rs 默认 GRPC_ADDR=0.0.0.0:50059, 用 env 覆盖为 50057 避免与 battle 50058 冲突
            - name: GRPC_ADDR
              value: "0.0.0.0:50057"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scene-db-credentials
                  key: url
                  optional: true  # Phase 1.5 占位, 真实 DB 待 Phase 2 实施
            - name: NATS_URI
              value: "nats://nats:4222"
            - name: RGS_TLS_DIR
              value: "/etc/rgs/certs"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "scene-service"
            - name: RGS_DOMAIN
              value: "scene"
            - name: RGS_ALLOW_INSECURE_GRPC
              value: "0"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=127.0.0.1:50057
                - -tls
                - -tls-client-cert=/etc/rgs/certs/server.pem
                - -tls-client-key=/etc/rgs/certs/server.key
                - -tls-ca-cert=/etc/rgs/certs/ca-sbn.pem
                - -tls-server-name=scene.service
                - -connect-timeout=2s
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=127.0.0.1:50057
                - -tls
                - -tls-client-cert=/etc/rgs/certs/server.pem
                - -tls-client-key=/etc/rgs/certs/server.key
                - -tls-ca-cert=/etc/rgs/certs/ca-sbn.pem
                - -tls-server-name=scene.service
                - -connect-timeout=2s
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: rgs-tls
              mountPath: /etc/rgs/certs
              readOnly: true
      volumes:
        - name: rgs-tls
          projected:
            sources:
              - secret:
                  name: rgs-secret-scene-tls
                  items:
                    - key: tls.crt
                      path: server.pem
                    - key: tls.key
                      path: server.key
              # Phase 1.5 用 ca-sbn.pem (新 mini-CA), 不是 rgs-secret-ca (5 域 ca.pem)
              # Phase 2 实施后统一用 rgs-secret-ca, 5 域 + 7 域共享同一 CA
              - secret:
                  name: rgs-secret-ca-sbn
                  items:
                    - key: ca-sbn.pem
                      path: ca-sbn.pem
---
apiVersion: v1
kind: Service
metadata:
  name: scene-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: scene
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: rust-game-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scene
  ports:
    - name: grpc
      port: 50057
      targetPort: 50057
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scene-service-hpa
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: scene
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scene-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scene-service-pdb
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: scene
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene
