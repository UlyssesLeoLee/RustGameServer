        rust-game-server.io/domain: scene
    spec:
      containers:
      - command:
        - /app/bin/scene-service
        env:
        - name: RUST_LOG
          value: info,scene-service=debug,sqlx=warn,tonic=warn
        - name: GRPC_ADDR
          value: 0.0.0.0:50057
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: scene-db-credentials
              optional: true
        - name: NATS_URI
          value: nats://nats:4222
        - name: RGS_TLS_DIR
          value: /etc/rgs/certs
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_SERVICE_NAME
          value: scene-service
        - name: RGS_DOMAIN
          value: scene
        - name: RGS_ALLOW_INSECURE_GRPC
          value: "0"
        image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-scene-service
        imagePullPolicy: IfNotPresent
        # 2026-09-08 W36: 镜像内无 /bin/grpc_health_probe binary (W30 §2.2 实证),
        # 改 tcpSocket probe on 50057 (gRPC port), 0 改 image 0 改 binary.
        # 副作用: TCP alive ≠ gRPC health, 但 scene binary 真在跑 (W30 §4.3 实证
        # 启动 4h+), TCP 探针足够区分 "port 开了" vs "完全没起来".
        # 进一步 gRPC health 检查走业务级 9 域 mTLS ST (per 8/27 ST 阶段).
        livenessProbe:
          tcpSocket:
            port: 50057
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: scene
        ports:
        - containerPort: 50057
          name: grpc
          protocol: TCP
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 50057
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/rgs/certs
          name: rgs-tls
          readOnly: true
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: scene-service-account
