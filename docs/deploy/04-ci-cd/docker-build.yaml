# docker-build.yaml
# 角色：5 域 + cluster-ops + shared-platform 镜像构建
# 状态：🔴 NO-GO 占位（trigger 注释状态）
# 激活条件：G-CODE-05 Closed（Platform 架构师具名）+ G-CODE-06 Closed（CI 全绿）+ 镜像 registry 落地
# 重要：本 workflow 在 NO-GO 解除前 **禁止激活 trigger**
name: docker-build

# ⚠️ 以下 trigger 块在 NO-GO 解除前必须保持注释
# on:
#   push:
#     branches: [main]
#     tags: ['v*']
#   pull_request:
#     branches: [main]

on: workflow_dispatch    # 仅手动触发，CI 不自动构建

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false    # 镜像构建不并发取消

env:
  REGISTRY: PLACEHOLDER_REGISTRY
  IMAGE_NAMESPACE: PLACEHOLDER_NAMESPACE

jobs:
  build:
    runs-on: PLACEHOLDER_RUNNER     # 实际值：ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        domain:
          - player
          - economy
          - match
          - social
          - admin
          - cluster-ops
          - shared-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.PLACEHOLDER_REGISTRY_USER }}
          password: ${{ secrets.PLACEHOLDER_REGISTRY_PASSWORD }}
        # ⚠️ 实际凭证在 NO-GO 解除后由 Platform 架构师 + SRE 联合注入
        # ⚠️ 禁止在 git 历史中提交实际凭证

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.domain }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.domain }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # ⚠️ 实际 Dockerfile 路径在 NO-GO 解除后由 Platform 架构师 + SRE 联合约定
        # ⚠️ 实际镜像 tag（PLACEHOLDER）由 CI 替换为真实 semver

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.domain }}:${{ steps.meta.outputs.version }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.domain }}.cyclonedx.json
