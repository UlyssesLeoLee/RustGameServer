# kubelet config drop-in: 99-override.conf
# 路径: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-override.conf
# 权限: 644 (k3s 自动加载 + 合并, 比 00-k3s-defaults.conf 优先)
#
# 派生约束 L29 (per AGENTS.md v0.6.14+): WSL2 + cgroup v1 装 k3s 1.37 必须 2 件套:
# 1. failCgroupV1: false   (k3s 1.37 默认 true, 会拒启)
# 2. cgroupDriver: cgroupfs (WSL2 systemd cgroup v1, 不能用 systemd driver, 否则
#    pod 创建会 mkdir /sys/fs/cgroup/devices/kubepods.slice/... 失败)
#
# 教训: 9/10 12:55 JST 跟 cgroup driver systemd 跟 WSL2 cgroup v1 不匹配, pod 卡
# FailedCreatePodContainer mkdir ... no such file or directory. 改 cgroupfs 后 5 域
# pod 跑 ContainerCreating 正常进入 image pull 阶段.

apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
failCgroupV1: false
cgroupDriver: cgroupfs
