# player values.yaml
# 状态：🔴 NO-GO 占位（per RGS-PLAN-001 v0.7 §3.3）
# 实际值写入条件：player 域 Lead 具名签字 + 7 G-CODE Closed + 12 类签字栏全部具名签字

enabled: true

image:
  repository: PLACEHOLDER_PLAYER_IMAGE
  tag: PLACEHOLDER
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: PLACEHOLDER_PLAYER_SA

service:
  type: ClusterIP
  grpcPort: PLACEHOLDER_PLAYER_GRPC_PORT
  metricsPort: PLACEHOLDER_PLAYER_METRICS_PORT

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: PLACEHOLDER_PLAYER_CPU_TARGET


# 域内 ConfigMap 配置（实际值由 player 域 Lead 校准）
config:
  PLAYER_SESSION_TTL_SEC: "PLACEHOLDER_PLAYER_SESSION_TTL"
  PLAYER_CACHE_SIZE: "PLACEHOLDER_PLAYER_CACHE_SIZE"
  PLAYER_RATE_LIMIT_RPS: "PLACEHOLDER_PLAYER_RATE_LIMIT"

# Secret 引用（**仅 reference，不存值** — Secret values 由 SRE 通过加密仓管理）
secretRefs:
  - name: PLACEHOLDER_PLAYER_DB_SECRET
    key: PLACEHOLDER_PLAYER_DB_KEY

# 标签
labels:
  app.kubernetes.io/name: player
  app.kubernetes.io/component: domain-service
  app.kubernetes.io/part-of: rust-game-server
