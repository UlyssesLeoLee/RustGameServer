[workspace]
members = [
    "crates/rgs-hello",
    "crates/player-service",
    "crates/economy-service",
    "crates/match-service",
    "crates/social-service",
    "crates/admin-service",
    "crates/cluster-ops",
    "crates/shared-platform",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/UlyssesLeoLee/RustGameServer"
authors = ["Ulysses <UlyssesLeoLee@users.noreply.github.com>"]

[workspace.dependencies]
# 公共服务依赖（按需 enable，53.2 仅占位声明）
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1