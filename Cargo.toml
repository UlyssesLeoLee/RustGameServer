[workspace]
members = [
    "crates/rgs-hello",
    "crates/player-service",
    "crates/economy-service",
    "crates/match-service",
    "crates/social-service",
    "crates/admin-service",
    "crates/cluster-ops",
    "crates/shared-platform",
    "crates/gm-backend",
    "crates/rgs-testkit",
    "crates/rgs-certgen",
    "crates/function-plane",
    "crates/rgs-arc-olu",
    "crates/rgs-overflow-alert",
    "crates/rgs-asset-download",
    "crates/card-service",
    "crates/i18n-service",
    "crates/leaderboard-service",
    "crates/replay-service",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/UlyssesLeoLee/RustGameServer"
authors = ["Ulysses <UlyssesLeoLee@users.noreply.github.com>"]

[workspace.dependencies]
# 公共服务依赖（53.2 占位声明；54.1 启用）
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
# 54.1 启用：gRPC / DB / 时间 / UUID
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
# grpc.health.v1.Health 服务（k8s exec 探针走 grpc_health_probe + mTLS，per Phase 0.5 探针修复）
tonic-health = "0.12"
prost = "0.13"
prost-types = "0.13"
# 54.1 sqlx 0.8：5 域各自独立 DATABASE_URL（per ARC-008 5 独立 DB 原则）
# 54.4 加 migrate feature（sqlx::migrate! 宏）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
# 时间戳 + UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 54.4 tonic-build 启用时用
tonic-build = { version = "0.12", features = ["prost"] }
# 54.1 接受：opentelemetry 启用待 53.12 OTel SDK 接入（54.13）
opentelemetry = "0.24"
opentelemetry-otlp = { version = "0.17", features = ["tonic"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
# RGS-INC-001 v0.2 §8/§9/§15 mock: WASM runtime + WAT text format
wasmtime = "19"
wat = "1"
# 2026-08-27 超限排队 + 邮件告警（per 任务 §2.1）
# - async-nats 0.42（与 shared-platform::producer 同主线，已在 lock）
# - lettre 0.11：tokio1-rustls-tls 组合 feature（per .worker-tmp/HANDOFF-ENV-CHECK.md §5）
async-nats = "0.42"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1

# 2026-09-05 P1-6: workspace 集中 lint policy
# - unsafe_code = "forbid" (5 域主链路 + 平台层全禁 unsafe)
# - missing_debug_implementations = "warn" (公共 API 应可调试)
# - clippy::unwrap_used = "warn" (生产路径 unwrap 警告, 已在 test 范围 #[allow])
# - clippy::expect_used = "warn" (同 unwrap)
# - clippy::result_large_err = "allow" (per clippy.toml large-error-ignored, sqlx::Error + tonic::Status 必要)
# - clippy::all = "warn" (中等严格度, 不直接 deny 避免 baseline warning 爆炸)
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
result_large_err = "allow"
