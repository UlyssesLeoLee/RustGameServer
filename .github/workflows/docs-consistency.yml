name: 文档体系一致性检查

# 处置RSK-PAT-001／TBD-PAT-002：ARC/ADR序列、域内TBD/RSK登记、README链接的
# 机械一致性校验，避免RGS-BAS-010式的"归纳范围滞后11份文档才被发现"重演。
# 归属：RGS-BAS-002§4.2既有CI/CD流水线骨架的lint阶段（同GOV-OLU-003"不新建
# 独立流水线"原则），仅在docs/路径发生变更时触发。

on:
  pull_request:
    paths:
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行文档一致性检查脚本
        run: ./scripts/check-docs-consistency.sh
