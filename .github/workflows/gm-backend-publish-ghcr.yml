name: gm-backend-publish-ghcr

# Purpose: 在 GitHub-hosted runner 上 build gm-backend 0.1.0 镜像 + push 到 ghcr.io
# Triggered by: workflow_dispatch(用 fine-grained PAT 调用 REST API)
# 认证: GITHUB_TOKEN(per workflow permissions: packages: write),不用任何长期 PAT
# Per 2026-08-27 12:43 JST Ulysses 部署指令 + 15:18 JST 升级到 fine-grained PAT 安全模型

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag(默认 0.1.0-gm-backend)'
        required: false
        default: '0.1.0-gm-backend'
        type: string

# 关键:只给 packages:write + contents:read,不超授
permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # docker buildx / ghcr.io 强制 lowercase;github.repository 包含大写需转
  IMAGE_NAME: ${{ github.repository_owner }}/rustgameserver

jobs:
  build-and-push:
    name: cargo build (linux) + docker build + push ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98

      - name: Install protoc(shared-platform build.rs 需 tonic-build / prost-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gm-backend -> target

      - name: cargo build --release -p gm-backend
        working-directory: .
        run: |
          cargo build --release -p gm-backend --locked

      - name: Prepare gm-backend build context
        run: |
          mkdir -p /tmp/gm-build
          cp target/release/gm-backend /tmp/gm-build/gm-backend
          ls -la /tmp/gm-build/

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (distroless,linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: /tmp/gm-build
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=gm-backend
            org.opencontainers.image.description=GM backend APIGW (per RGS-BAS-003 §2.1)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          platforms: linux/amd64

  verify:
    name: verify push + summarize
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: curl registry manifest
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/${{ inputs.tag }}" \
            | jq .
      - name: summary
        run: |
          echo "✅ Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          echo "Run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
