# docker-build —— CI workflow 4（per WBS v0.3 §2A.5 WF-1-53.7）
# 触发：push to main（path 过滤 Dockerfiles）/ tag v*.*.* / workflow_dispatch
# 范围：build prod target 一次（6 域共用同一镜像，靠 k8s command 分流），
#       push 到 ghcr.io，tag 0.1.0 + latest
# 规范：RGS-IMPL-005 §3（distroless Dockerfile）+ RGS-IMPL-006 §4（CI 编排）

name: docker-build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "crates/**/Dockerfile"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "crates/**/Dockerfile"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push to ghcr.io on workflow_dispatch"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 2026-08-26 22:34 JST 加：rust-ci gate
  # 防止 main 上有 cargo test 编译错误时仍 build/push docker image
  # 依赖 rust-ci workflow 跑过（cargo test --workspace pass）才能进 docker build
  # 见 RGS-INC-002 v0.1 复盘 + cluster-ops drill 编译 bug
  rust-ci-gate:
    name: cargo test gate（防止编译不过的代码 push image）
    uses: ./.github/workflows/rust-ci.yml

  docker-build:
    name: docker buildx（53.7 占位 trigger；实际 build 在 53.13 后启用）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: rust-ci-gate  # 2026-08-26 22:34 JST 加：等 rust-ci 通过才能 build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # 53.7 占位；57.5 跨架构（amd64 + arm64）启用
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=0.1.0,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 6 个域（player/economy/match/social/admin/cluster-ops）共用同一个
      # prod target 镜像：cargo build --workspace 把 6 个 binary 都打进
      # /app/bin/，k8s manifest 用 command: ["/app/bin/xxx-service"] 挑选
      # 实际启动的进程，因此这里只 build 一次、打一个版本 tag（0.1.0），
      # 不需要 6 个 type=raw tag。
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_registry == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max