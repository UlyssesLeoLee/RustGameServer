# docker-build —— CI workflow 4（per WBS v0.3 §2A.5 WF-1-53.7）
# 触发：push to main（path 过滤 Dockerfiles）/ tag v*.*.* / workflow_dispatch
# 范围：53.7 占位 trigger 框架 + buildx + ghcr.io 登录
#       实际 docker build 等 53.13 distroless base image 完成后启用
# 规范：RGS-IMPL-005 §3（distroless Dockerfile）+ RGS-IMPL-006 §4（CI 编排）

name: docker-build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "crates/**/Dockerfile"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "crates/**/Dockerfile"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push to ghcr.io on workflow_dispatch"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    name: docker buildx（53.7 占位 trigger；实际 build 在 53.13 后启用）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # 53.7 占位；57.5 跨架构（amd64 + arm64）启用
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push（53.7 占位注释）
        # 53.7 接受：distroless base image Dockerfile 待 53.13 实施；
        #           镜像推送待 57.8 cosign keyless 签名配套。
        # 启用时把 use 改为：
        #   uses: docker/build-push-action@v5
        #   with:
        #     context: .
        #     file: ./Dockerfile
        #     platforms: linux/amd64  # 53.7 单平台；57.5 加 linux/arm64
        #     push: ${{ github.event_name != 'pull_request' }}
        #     tags: ${{ steps.meta.outputs.tags }}
        #     labels: ${{ steps.meta.outputs.labels }}
        #     cache-from: type=gha
        #     cache-to: type=gha,mode=max
        run: |
          echo "::notice::docker-build 占位 trigger 框架（per WBS v0.3 §2A.5 WF-1-53.7）"
          echo "::notice::实际 docker build 待 WF-1-53.13 distroless base image 完成后启用"
          echo "::notice::镜像推送待 WF-1-57.8 cosign keyless 签名配套"
          echo "::notice::跨架构待 WF-1-57.5 docker buildx 跨架构（amd64 + arm64）"
          echo "OK docker-build 占位 trigger 已就绪（53.7 范围内）"