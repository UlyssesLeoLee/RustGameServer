# code-structure-validation —— CI workflow 5（per WBS v0.3 §2A.5 WF-1-53.8 + ULYS-254）
# 触发：push to main, pull_request to main, workflow_dispatch, workflow_call
# 范围：tools/cypher-header-gen/ 下的 cypher_header 验证（manifest 同步 + verify_headers 规则 2-6 + 跨文件 CALLS 审计；
#       规则 1 FIDELITY 需要生成前 baseline，CI 不具备，故不在 CI 中执行，见 RGS-DTL-010 §7）
# 规范：RGS-BAS-009 §4（CI 机械校验设计，含 Cypher 验证）+ RGS-BAS-002 §4.2（代码侧 CI/CD 流水线骨架）
# 追溯：ULYS-254 / RGS-BAS-009 v0.8 / RGS-DTL-010/ ARC-025
#
# 这是 RGS-BAS-002 §4.2 代码侧 CI/CD 流水线骨架中的「结构校验阶段」，
# 与 docs-ci.yml（文档 lint）、verify-docs-ci.yml（文档登记一致性）并列独立，
# 由 ci-unified.yml 通过 `workflow_call` 收口为统一流水线入口。
# 三个独立工作流（docs-ci / verify-docs-ci / code-structure-validation）的关系
# 详见 .github/workflows/ci-unified.yml。

name: code-structure-validation

on:
  push:
    branches: [main]
    paths:
      - "crates/**/*.rs"
      - "tools/**/*.rs"
      - "tools/cypher-header-gen/**"
      - ".github/workflows/code-structure-validation.yml"
      - ".github/workflows/ci-unified.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**/*.rs"
      - "tools/**/*.rs"
      - "tools/cypher-header-gen/**"
      - ".github/workflows/code-structure-validation.yml"
      - ".github/workflows/ci-unified.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      strict:
        description: "block on any warning (default: warn on warnings, error on failures)"
        required: false
        default: "warn"
        type: string  # workflow_call 不支持 choice；取值 "warn" | "block"

permissions:
  contents: read

env:
  # gov.ci.cypher_* 事件落盘位置（per RGS-BAS-009 §4 本功能日志设计）
  CYPHER_CI_LOG_DIR: .ci-logs/cypher

jobs:
  cypher-validation:
    name: cypher header + cross-file CALLS audit on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare CI log dir
        # gov.ci.cypher_run_started 落盘（per BAS-009 §4 release 必出 + 100% 强制全采样）
        # RUN_ID 经 $GITHUB_ENV 传给后续 step（shell 变量不跨 step）
        run: |
          mkdir -p "$CYPHER_CI_LOG_DIR"
          RUN_ID="${{ github.run_id }}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "CYPHER_RUN_LOG=${CYPHER_CI_LOG_DIR}/run_${RUN_ID}.jsonl" >> "$GITHUB_ENV"
          echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_run_started","run_id":"'${RUN_ID}'","commit_sha":"${{ github.sha }}","triggered_by":"${{ github.event_name }}","workflow":"code-structure-validation"}' > "${CYPHER_CI_LOG_DIR}/run_${RUN_ID}.jsonl"

      - name: Run cypher_header.py --check (manifest 与代码同步)
        # 阻断级：manifest 与代码不同步 = 必须重新生成。
        # cypher_header.py --check 自身恒返回 0，只在 summary.changed 中报告需改写的文件数，故在此判定。
        # 只能带 --check 运行：不带时会直接改写全部 .rs 文件。
        run: |
          echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_started","run_id":"'${RUN_ID}'","check_kind":"code_structure","check_id":"cypher_header_sync","phase":"all"}' >> "$CYPHER_RUN_LOG"
          python tools/cypher-header-gen/cypher_header.py --check --json > "$CYPHER_CI_LOG_DIR/cypher_header_check.json"
          CHANGED=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["changed"])' "$CYPHER_CI_LOG_DIR/cypher_header_check.json")
          if [ "$CHANGED" = "0" ]; then
            echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_passed","run_id":"'${RUN_ID}'","check_kind":"code_structure","check_id":"cypher_header_sync","severity":"block"}' >> "$CYPHER_RUN_LOG"
          else
            echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_failed","run_id":"'${RUN_ID}'","check_kind":"code_structure","check_id":"cypher_header_sync","severity":"block"}' >> "$CYPHER_RUN_LOG"
            echo "::error::${CHANGED} file(s) have a Cypher manifest out of sync with the code; run python tools/cypher-header-gen/cypher_header.py and commit"
            exit 1
          fi

      - name: Run verify_headers.py (规则 2-6：COVERAGE/VOCABULARY/REFERENTIAL/EXECUTABLE/COMMENTED)
        # 阻断级：任一规则失败 = CI 红。未传 --baseline，规则 1 FIDELITY 不执行（见文件头）
        run: |
          echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_started","run_id":"'${RUN_ID}'","check_kind":"code_structure","check_id":"verify_headers","phase":"all"}' >> "$CYPHER_RUN_LOG"
          if python tools/cypher-header-gen/verify_headers.py > "$CYPHER_CI_LOG_DIR/verify_headers.${RUN_ID}.log" 2>&1; then
            cat "$CYPHER_CI_LOG_DIR/verify_headers.${RUN_ID}.log"
            echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_passed","run_id":"'${RUN_ID}'","check_kind":"code_structure","check_id":"verify_headers","severity":"block"}' >> "$CYPHER_RUN_LOG"
          else
            cat "$CYPHER_CI_LOG_DIR/verify_headers.${RUN_ID}.log"
            echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_failed","run_id":"'${RUN_ID}'","check_kind":"code_structure","check_id":"verify_headers","severity":"block"}' >> "$CYPHER_RUN_LOG"
            exit 1
          fi

      - name: Run cross_check_calls.py (跨文件 CALLS 真实性审计)
        # 阻断级：每个 CALLS 声明必须真的能在函数体里找到（per cross_check_calls.py README）
        run: |
          echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_started","run_id":"'${RUN_ID}'","check_kind":"calls_audit","check_id":"cross_check_calls","phase":"calls_audit"}' >> "$CYPHER_RUN_LOG"
          if python tools/cypher-header-gen/cross_check_calls.py > "$CYPHER_CI_LOG_DIR/cross_check_calls.${RUN_ID}.log" 2>&1; then
            cat "$CYPHER_CI_LOG_DIR/cross_check_calls.${RUN_ID}.log"
            echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_passed","run_id":"'${RUN_ID}'","check_kind":"calls_audit","check_id":"cross_check_calls","severity":"block"}' >> "$CYPHER_RUN_LOG"
          else
            cat "$CYPHER_CI_LOG_DIR/cross_check_calls.${RUN_ID}.log"
            echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_check_failed","run_id":"'${RUN_ID}'","check_kind":"calls_audit","check_id":"cross_check_calls","severity":"block"}' >> "$CYPHER_RUN_LOG"
            exit 1
          fi

      - name: Emit gov.ci.cypher_run_completed
        if: always()
        run: |
          PASSED=$(grep -c '"event":"gov.ci.cypher_check_passed"' "$CYPHER_RUN_LOG" || true)
          FAILED=$(grep -c '"event":"gov.ci.cypher_check_failed"' "$CYPHER_RUN_LOG" || true)
          echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","event":"gov.ci.cypher_run_completed","run_id":"'${RUN_ID}'","passed":'${PASSED:-0}',"failed":'${FAILED:-0}',"job_status":"${{ job.status }}"}' >> "$CYPHER_RUN_LOG"

      - name: Upload CI log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypher-ci-log-${{ github.run_id }}
          path: .ci-logs/cypher/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## code-structure-validation summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- run_id: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- job status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- log: .ci-logs/cypher/run_${{ github.run_id }}.jsonl" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Per RGS-BAS-009 §4: gov.ci.cypher_* events are release 必出 + 100% 强制全采样。" >> $GITHUB_STEP_SUMMARY
