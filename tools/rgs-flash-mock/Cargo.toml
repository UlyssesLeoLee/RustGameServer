[workspace]
# rgs-flash-mock cargo project (独立 workspace, per AGENTS.md v0.4 §7.1 batch 域母规范)

[package]
name = "rgs-flash-mock"
version = "0.1.0"
edition = "2021"
description = "rgs-flash-mock (Rust + actix-web 4 + tokio + tonic 0.12 gRPC client + mTLS, per RGS-FLASH-MOCK-DESIGN-2026-09-04 v0.1, 闪烁之光 1351 RPC gateway/verification harness, 12 大类 PoC v0.1 = 22 RPC)"
license = "Apache-2.0"

[[bin]]
name = "rgs-flash-mock"
path = "src/main.rs"

[dependencies]
# HTTP/JSON front (per rgs-batch-backend 模式 + 闪烁之光 client 协议兼容)
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
# gRPC back (per RGS 5 域 + card + gm-backend 7 域 backend)
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 时间戳 + UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 错误处理
anyhow = "1"
thiserror = "1"
# tracing + JSON logging (per shared-platform::json_logging 一致)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 异步工具
async-trait = "0.1"
futures = "0.3"
once_cell = "1"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
