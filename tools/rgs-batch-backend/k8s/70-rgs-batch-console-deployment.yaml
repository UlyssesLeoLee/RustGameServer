# rgs-batch-console deployment (per BATCH-PLAN v0.2 §3.1 W1 BA-W1-3, 2026-09-02 02:00 JST Mavis 接手代签)
# Node 22 原生 http, 监听 127.0.0.1:8789
# 零依赖, 镜像基于 node:22-alpine

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rgs-batch-console
  namespace: rgs-batch
  labels:
    app: rgs-batch-console
    app.kubernetes.io/name: rgs-batch-console
    app.kubernetes.io/part-of: rgs-batch
    app.kubernetes.io/version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rgs-batch-console
  template:
    metadata:
      labels:
        app: rgs-batch-console
    spec:
      containers:
        - name: rgs-batch-console
          image: rgs-batch-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8789
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rgs-batch-console
  namespace: rgs-batch
  labels:
    app: rgs-batch-console
spec:
  type: ClusterIP
  selector:
    app: rgs-batch-console
  ports:
    - name: http
      port: 8789
      targetPort: http
      protocol: TCP
