# rgs-batch envoy config (per BATCH-PLAN v0.2 §3.1 W1 BA-W1-6, 2026-09-02 02:00 JST Mavis 接手代签)
# mTLS termination + reverse proxy to console + backend
# file_system HTTP filter 托管 console 静态资源 (per AGENTS.md v0.4 §7.4 4 复用 rgs-web 母规范)

apiVersion: v1
kind: ConfigMap
metadata:
  name: rgs-batch-envoy-config
  namespace: rgs-batch
  labels:
    app: rgs-batch-envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_https
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/certs/tls.crt }
                        private_key: { filename: /etc/certs/tls.key }
              filters:
                - name: envoy.http_connection_manager
                  typed_config:
                    stat_prefix: rgs_batch_https
                    route_config:
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/api/" }
                              route: { cluster: rgs_batch_backend, timeout: 30s }
                            - match: { prefix: "/" }
                              route: { cluster: rgs_batch_console, timeout: 10s }
                    http_filters:
                      - name: envoy.router
                        typed_config: {}
        - name: listener_http
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.http_connection_manager
                  typed_config:
                    stat_prefix: rgs_batch_http
                    route_config:
                      virtual_hosts:
                        - name: redirect
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              redirect: { https_redirect: true }
                    http_filters:
                      - name: envoy.router
                        typed_config: {}
      clusters:
        - name: rgs_batch_backend
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: rgs_batch_backend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: rgs-batch-backend, port_value: 8790 }
        - name: rgs_batch_console
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: rgs_batch_console
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: rgs-batch-console, port_value: 8789 }
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    readiness:
      log_path: /tmp/envoy_ready.log
      watch:
        - path: /etc/envoy
        - path: /etc/certs
