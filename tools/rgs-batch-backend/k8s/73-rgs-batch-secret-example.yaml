# rgs-batch secret example (per BATCH-PLAN v0.2 §3.1 W1 BA-W1-3, 2026-09-02 02:00 JST Mavis 接手代签)
# 凭据注入模板 (实际 secret 由 sre-inject-secrets.sh 注入, per OPEN-QA v0.3 §7.4)
# 凭据永不打印, 永不 echo 值 (per 8/27 11:06 JST 硬 ban + AGENTS.md v0.4 §7.4 NFR-30)

apiVersion: v1
kind: Secret
metadata:
  name: rgs-batch-db
  namespace: rgs-batch
  labels:
    app: rgs-batch
  annotations:
    description: "rgs-batch-backend PostgreSQL 凭据, 由 sre-inject-secrets.sh 注入"
type: Opaque
stringData:
  # 占位, 实际部署时由 SRE 替换 (per 8/27 11:06 JST 硬 ban)
  url: "postgresql://rgs_batch:REDACTED@postgres-rgs:5432/rgs_batch?sslmode=require"
  username: "rgs_batch"
  password: "REDACTED"
---
apiVersion: v1
kind: Secret
metadata:
  name: rgs-batch-5domain-certs
  namespace: rgs-batch
  labels:
    app: rgs-batch
  annotations:
    description: "5 域 mTLS 业务级证书 (per 5 域 ST 实践 commit 401ac5c), 由 sre-inject-secrets.sh 注入"
type: Opaque
data:
  # 占位, base64 编码, 实际由 SRE 注入 (per 8/27 11:06 JST 硬 ban)
  ca.crt: "UkVBQ1RFRC1DRVJULURBVEE="
  player.crt: "UkVBQ1RFRC1DRVJULURBVEE="
  player.key: "UkVBQ1RFRC1DRVJULURBVEE="
  economy.crt: "UkVBQ1RFRC1DRVJULURBVEE="
  economy.key: "UkVBQ1RFRC1DRVJULURBVEE="
  match.crt: "UkVBQ1RFRC1DRVJULURBVEE="
  match.key: "UkVBQ1RFRC1DRVJULURBVEE="
  social.crt: "UkVBQ1RFRC1DRVJULURBVEE="
  social.key: "UkVBQ1RFRC1DRVJULURBVEE="
  admin.crt: "UkVBQ1RFRC1DRVJULURBVEE="
