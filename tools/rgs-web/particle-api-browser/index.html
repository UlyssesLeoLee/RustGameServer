<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>粒子 API 浏览器 — DEV-PAB-001</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">
        <span class="app-title-icon">🌌</span>
        <span id="app-title">粒子 API 浏览器</span>
        <span style="font-size:11px; color:var(--fg-3); font-weight:400; margin-left:8px;">DEV-PAB-001 v0.1</span>
      </h1>
      <div class="header-row">
        <nav id="engine-tabs" class="engine-tabs" role="tablist" aria-label="引擎选择"></nav>
        <div class="search-box">
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="搜索 API 名称、描述、标签… (按 / 聚焦)"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="search-hint">/</span>
        </div>
      </div>
    </header>

    <div id="banner" class="banner" role="alert"></div>

    <nav id="cat-tabs" class="sub-tab-bar cat-tabs" role="tablist" aria-label="类别选择"></nav>

    <main class="app-main">
      <ul id="api-list" class="api-list" role="listbox" aria-label="API 列表"></ul>
    </main>

    <footer class="app-footer">
      <span id="list-count">—</span>
      <span id="footer-version">DEV-PAB-001 v0.1</span>
    </footer>
  </div>

  <div id="modal-root" class="modal-root" aria-hidden="true"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
