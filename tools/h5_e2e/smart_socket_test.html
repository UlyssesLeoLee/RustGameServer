<!DOCTYPE html>
<!--
  tools/h5_e2e/smart_socket_test.html

  Browser harness that exercises the EXACT same SmartSocket code path as
  [游戏A]_client_h5/assets/Scripts/sys/game-core-js-min.js, but with the host/port
  + WebSocket target overridden via window globals so we can point at the local
  mock_server.mjs (or the future RGS network-gateway once ULYS-2.2 lands).

  This file is NOT [游戏A]_client_h5 itself — [游戏A]_client_h5 is Cocos Creator source
  with no pre-built bundle, so we can't `page.goto()` its index.html. Instead
  this page re-implements the protocol-shaping piece of SmartSocket:

      new WebSocket(ws + "://" + host + ":" + port + "/websocket").binaryType =
        "arraybuffer";
      send(cmd, payload) { packData + setUint32(0, i.length) + write }
      onmessage -> unpackBuffer -> unpackData

  …plus the 1-second heartbeat tick from `tick()` and `setTickTimer()`.

  If ULYS-2.1+2.2+2.3 are running, set window globals before connecting:
      window.GAMEA_WS_URL = 'ws://127.0.0.1:8000/websocket'
      window.GAMEA_TEST_LOGIN = true       // also send a login frame
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>[游戏A] SmartSocket E2E test harness</title>
<style>
  body { font: 13px/1.5 -apple-system, Segoe UI, sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  pre { background: #f4f4f4; padding: 8px; border-radius: 4px; max-height: 320px; overflow: auto; }
  .frame-send { color: #0a6; }
  .frame-recv { color: #06c; }
  #login-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #status { display: inline-block; margin-left: 8px; padding: 4px 8px; border-radius: 3px; background: #ddd; }
  #status.connected { background: #cfc; }
  #status.disconnected { background: #fcc; }
</style>
</head>
<body>
<h1>[游戏A] SmartSocket E2E harness</h1>
<p>
  Target: <code id="target-url"></code>
  Status: <span id="status">disconnected</span>
</p>
<p>
  <button id="connect-btn">Connect</button>
  <button id="login-btn">Send login (cmd=1110)</button>
  <button id="hb-btn">Send heartbeat now (cmd=1199)</button>
</p>
<pre id="log"></pre>

<script src="./[游戏A]_protocol.browser.js"></script>
<script>
'use strict';

// ============ Minimal SmartSocket clone (matches game-core-js-min.js) ============
// Reference: assets/Scripts/sys/game-core-js-min.js line 3 (the entire minified
// SmartSocket block). Differences from the original:
//   - host/port pulled from window.GAMEA_WS_URL if set (D2 host/port override)
//   - frame events also exposed to Playwright via window.__[游戏A]_frames__
//   - console.log for human-visible trace (puppeteer page.on('console'))
const SmartSocket = {
  idx: 0,
  ws: null,
  buffer: null,
  cmd_func_list: {},
  msg_list: [],
  diff_time: 0,
  wait_time: 0,
  getTime() { return this.diff_time + parseInt(Date.now() / 1e3); },
  init() {
    if (this.is_init) return;
    this.is_init = true;
    this.bindCmd(1199, this.on1199.bind(this));
  },
  on1199(t) {
    this.restHeartbeat();
    this.setTime(t.time);
    window.__[游戏A]Log__('recv cmd=1199 heartbeat time=' + t.time);
  },
  tick() {
    this.send(1199, {});
    this.setTickTimer();
  },
  restHeartbeat() { this.wait_time = 0; },
  updateTimer() {
    if (this.ws) {
      this.wait_time += 1;
      if (this.wait_time >= 10) this.close();
      else if (this.wait_time >= 6) this.send(1199, {});
    }
  },
  setTickTimer() {
    if (this.heart_timer) return;
    this.heart_timer = setInterval(this.updateTimer.bind(this), 1000);
  },
  stopHeart() {
    if (this.heart_timer) { clearInterval(this.heart_timer); this.heart_timer = null; }
  },
  connect(url) {
    // url: full ws://…/websocket
    this.buffer = null;
    this.msg_list = [];
    const ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    const net_id = ++this.idx;
    this.ws = ws;
    window.__[游戏A]Log__('opening WS to ' + url + ' (net_id=' + net_id + ')');
    ws.onopen = () => {
      if (net_id !== this.idx) return;
      window.__[游戏A]Log__('onopen');
      document.getElementById('status').textContent = 'connected';
      document.getElementById('status').className = 'connected';
      window.__[游戏A]Frames__.push({ dir: 'open', at: Date.now(), url });
      this.setTickTimer();
      this.restHeartbeat();
      // First heartbeat immediately (matches SmartSocket.tick behavior)
      this.send(1199, {});
    };
    ws.onclose = () => {
      if (net_id !== this.idx) return;
      window.__[游戏A]Log__('onclose');
      document.getElementById('status').textContent = 'disconnected';
      document.getElementById('status').className = 'disconnected';
      window.__[游戏A]Frames__.push({ dir: 'close', at: Date.now() });
      this.stopHeart();
      this.ws = null;
    };
    ws.onerror = (e) => window.__[游戏A]Log__('onerror ' + (e && e.message || ''));
    ws.onmessage = (t) => {
      this.restHeartbeat();
      this.doRecv(t.data);
    };
  },
  close() { if (this.ws) { this.ws.close(); this.ws = null; } },
  bindCmd(cmd, fn) {
    if (!this.cmd_func_list.hasOwnProperty(cmd)) this.cmd_func_list[cmd] = [];
    this.cmd_func_list[cmd].push(fn);
  },
  // send(cmd, data) → builds wire frame and ws.send()s.
  send(cmd, data) {
    try {
      if (this.ws == null) { window.__[游戏A]Log__('send: socket not connected'); return; }
      // packFields gives us the payload TLV bytes
      // (the real client calls Proto.send[cmd] schema; here we hardcode per-cmd)
      const payload = window.GAMEA.packPayload(cmd, data);
      const fullCmd = window.GAMEA.encodeFrame(cmd, payload);
      window.__[游戏A]Frames__.push({
        dir: 'send',
        at: Date.now(),
        cmd,
        payloadLen: payload.length,
        hex: window.__[游戏A]_toHex(new Uint8Array(fullCmd)),
      });
      window.__[游戏A]Log__('send cmd=' + cmd + ' hex=' + window.__[游戏A]_toHex(new Uint8Array(fullCmd)));
      this.ws.send(fullCmd);
    } catch (e) {
      window.__[游戏A]Log__('send error: ' + e.message);
    }
  },
  doRecv(blob) {
    if (!this.ws || this.ws.net_id === undefined || this.ws !== this.ws) return; // (sanity)
    if (typeof blob === 'string') { window.__[游戏A]Log__('recv=text= ' + blob); return; }
    let bytes;
    if (this.buffer == null) bytes = new Uint8Array(blob);
    else bytes = this.buffer.concat(Array.from(new Uint8Array(blob)));
    this.unpackBuffer(bytes);
  },
  unpackBuffer(e) {
    if (e.length < 6) { this.buffer = e; return; }
    const t = new DataView(e.buffer, e.byteOffset, e.byteLength);
    const i = t.getUint32(0, false);
    if (i > 80000) { window.__[游戏A]Log__('data_to_long: ' + i); if (this.ws) this.ws.close(); return; }
    const totalLen = i + 4;
    const bufLen = e.length;
    if (bufLen < totalLen) { this.buffer = e; return; }
    const cmd = t.getUint16(4, false);
    window.__[游戏A]Frames__.push({
      dir: 'recv',
      at: Date.now(),
      cmd,
      payloadLen: i - 2,
      hex: window.__[游戏A]_toHex(e.slice(0, totalLen)),
    });
    window.__[游戏A]Log__('recv cmd=' + cmd + ' hex=' + window.__[游戏A]_toHex(e.slice(0, totalLen)));
    try {
      // Parse payload per cmd (uses per-cmd schema)
      const data = window.GAMEA.unpackPayload(cmd, e, 6, i - 2);
      this.msg_list.push({ cmd, data });
      // Dispatch
      const fns = this.cmd_func_list[cmd] || [];
      for (let i = 0; i < fns.length; i++) fns[i](data);
    } catch (err) {
      window.__[游戏A]Log__('unpackData_error cmd=' + cmd + ' err=' + err.message);
    }
    if (totalLen < bufLen) this.unpackBuffer(e.slice(totalLen));
    else this.buffer = null;
  },
  setTime(t) { this.diff_time = t - parseInt(Date.now() / 1e3); },
};
SmartSocket.init();
window.gcore = { SmartSocket };

// ============ page-level plumbing ============
window.__[游戏A]Frames__ = [];
window.__[游戏A]LogBuf__ = [];
window.__[游戏A]Log__ = (msg) => {
  const line = '[' + new Date().toISOString() + '] ' + msg;
  window.__[游戏A]LogBuf__.push(line);
  const el = document.getElementById('log');
  if (el) el.textContent = window.__[游戏A]LogBuf__.join('\n');
};

window.__[游戏A]_toHex = function (u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) {
    const h = u8[i].toString(16);
    s += (h.length === 1 ? '0' + h : h);
    if (i < u8.length - 1) s += ' ';
  }
  return s;
};

document.getElementById('connect-btn').onclick = () => {
  const url = window.GAMEA_WS_URL || 'ws://127.0.0.1:18000/websocket';
  document.getElementById('target-url').textContent = url;
  window.gcore.SmartSocket.connect(url);
};
document.getElementById('hb-btn').onclick = () => window.gcore.SmartSocket.send(1199, {});
document.getElementById('login-btn').onclick = () => window.gcore.SmartSocket.send(1110, {
  // Per proto_11.erl `pack(1110, cli, {V0_args})`: args is array of [key, val] pairs
  args: [['account', 'e2e@example.com'], ['pwd', 'p4ssw0rd']],
});

// Auto-connect on load if URL provided
window.addEventListener('DOMContentLoaded', () => {
  const url = window.GAMEA_WS_URL || 'ws://127.0.0.1:18000/websocket';
  document.getElementById('target-url').textContent = url;
});
</script>
</body>
</html>
