[package]
name = "rgs-testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RustGameServer 测试套件骨架（mock + helper + fixture）"

[dependencies]
# 公共能力（5 域 + cluster-ops + shared-platform 共用）
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 9/10 wave 3 mTLS 真实接入 (per DDD Review v0.3.1 §7.3 Phase C):
#   5 域 worker (player / economy / match / social / admin) 走真实 tonic::transport::Channel 替换 stub
#   transport + tls + tls-roots features: enable Endpoint::connect_lazy + ClientTlsConfig
#   5 域 ST 业务级 mTLS 实践 commit 401ac5c
tonic = { workspace = true }
# 9/10 wave 4 admin 域真实 RPC 接入 (per DDD Review v0.3.2 §7.3 L1.2):
#   prost 0.13 用于 admin proto client 生成的 `::prost::Message` derive
#   复用 workspace 版本 (5 域 ST 业务级 mTLS 实践 commit 401ac5c 统一 lock)
prost = { workspace = true }
# gRPC mock server (per 53.3 → 54.x: tonic gRPC fixture)
mockito = "1"
# DB 测试 fixture
# migrate feature required for #[sqlx::test] macro (per WF-1-55.31 retry)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 54.x 接入 testcontainers-rs (feature-gated; 默认不编译,避免无 Docker 环境编译失败)
# 启用: cargo test -p rgs-testkit --features testcontainers
testcontainers = { version = "0.23", optional = true }
testcontainers-modules = { version = "0.11", features = ["postgres"], optional = true }

[build-dependencies]
# 9/10 wave 4 admin 域真实 RPC 接入 (per DDD Review v0.3.2 §7.3 L1.2):
# - tonic-build 0.12 (workspace) 用于在 build.rs 生成 admin proto client
# - 仅生成 client (build_server=false), 不引入 server trait
# - 复用 admin-service/proto/ 源 proto (单一来源, 避免 proto 漂移)
# - L-CAND-016 防御: 只加 admin proto, 不改其他 4 域
tonic-build = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
tracing-test = "0.2"
mockall = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }

[features]
# 默认关: 不编译 PG 集成 test, CI 跑普通 test 不需要 DATABASE_URL.
# 启用: cargo test -p rgs-testkit --features pg-integration -- --include-ignored
#       (需先 docker compose up postgres + export DATABASE_URL)
default = []
pg-integration = []
# 54.x 接入: 启用 testcontainers-rs 自动起 PG 容器 (per init_test_db feature-gated 实现)
# 启用: cargo test -p rgs-testkit --features testcontainers
#       (需 Docker daemon 在 host 上运行)
testcontainers = ["dep:testcontainers", "dep:testcontainers-modules"]
