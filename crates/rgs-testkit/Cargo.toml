[package]
name = "rgs-testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RustGameServer 测试套件骨架（mock + helper + fixture）"

[dependencies]
# 公共能力（5 域 + cluster-ops + shared-platform 共用）
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 9/10 wave 3 mTLS 真实接入 (per DDD Review v0.3.1 §7.3 Phase C):
#   5 域 worker (player / economy / match / social / admin) 走真实 tonic::transport::Channel 替换 stub
#   transport + tls + tls-roots features: enable Endpoint::connect_lazy + ClientTlsConfig
#   5 域 ST 业务级 mTLS 实践 commit 401ac5c
tonic = { workspace = true }
# 9/10 wave 3 mTLS 真实接入 (per DDD Review v0.3.1 §7.3 Phase C):
#   rustls 0.23 默认 features 不带 crypto provider, 显式选 ring feature
#   + bot/mod.rs init_once install_default() 避免 27 test panic
rustls = { workspace = true }
# 9/10 wave 3 mTLS 真实接入 (per DDD Review v0.3.1 §7.3 Phase C):
#   ctor 0.2 强制 lib 加载时 install rustls ring crypto provider
#   避免 27 test panic at rustls-0.23.43/src/crypto/mod.rs:249:14
ctor = { workspace = true }
# 9/10 wave 4 真实 RPC 接入 (per DDD Review v0.3.2 §7.3 L1.2):
#   rgs-testkit build.rs 生成的 proto 代码 (player / match / admin + 共享 common) 引用 `::prost::Message` trait derive,
#   0.13 必须 workspace dep 才能解析 (5 域 service 同款)
#   5 worker 公共依赖入口 (per L-CAND-014 模式 + L-CAND-016 防御: 5 worker 同步)
prost = { workspace = true }
# gRPC mock server (per 53.3 → 54.x: tonic gRPC fixture)
mockito = "1"
# DB 测试 fixture
# migrate feature required for #[sqlx::test] macro (per WF-1-55.31 retry)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 54.x 接入 testcontainers-rs (feature-gated; 默认不编译,避免无 Docker 环境编译失败)
# 启用: cargo test -p rgs-testkit --features testcontainers
testcontainers = { version = "0.23", optional = true }
testcontainers-modules = { version = "0.11", features = ["postgres"], optional = true }
# 9/10 wave 4 mTLS 真实 RPC 接入 (per DDD Review v0.3.2 §7.3 L1.2):
#   economy + social 域 worker 加各自 service 为 rgs-testkit dep (path),
#   拿真实 service_client::XxxServiceClient 走真实 RPC 调用
#   (per wave 3 player.rs 注释: "wave 4 worker 加 <domain>-service 为 rgs-testkit dev-dep 后接"
#    实际是 lib 依赖因为 bot/ai/<domain>.rs 在 src/ 不是 tests/)
#   5 域同步模式 (per L-CAND-016 防御), 本 worker 只加各自域, 不动其他 4 域
#   - economy 域: economy-service path dep + get_account RPC (per commit c189700)
#   - social 域: social-service path dep + get_guild/health_check RPC (per commit f5bd50d)
economy-service = { path = "../economy-service" }
social-service = { path = "../social-service" }

[build-dependencies]
# 9/10 wave 4 真实 RPC 接入 (per DDD Review v0.3.2 §7.3 L1.2):
#   rgs-testkit build.rs 编译 player + match + admin 域 proto + 共享 common.proto
#   server 在 5 域 service 已编, build_server=false 避免重复
#   L-CAND-016 防御: 5 worker 各自 build.rs 内容已主会话手修合并 (per L-CAND-014 模式再现)
tonic-build = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
tracing-test = "0.2"
mockall = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }

[features]
# 默认关: 不编译 PG 集成 test, CI 跑普通 test 不需要 DATABASE_URL.
# 启用: cargo test -p rgs-testkit --features pg-integration -- --include-ignored
#       (需先 docker compose up postgres + export DATABASE_URL)
default = []
pg-integration = []
# 54.x 接入: 启用 testcontainers-rs 自动起 PG 容器 (per init_test_db feature-gated 实现)
# 启用: cargo test -p rgs-testkit --features testcontainers
#       (需 Docker daemon 在 host 上运行)
testcontainers = ["dep:testcontainers", "dep:testcontainers-modules"]
