apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-gateway
  namespace: rust-game-server
  labels:
    app: network-gateway
    version: "0.1.0"
    domain: network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-gateway
  template:
    metadata:
      labels:
        app: network-gateway
        domain: network
    spec:
      containers:
        - name: network-gateway
          image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-network-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-binary
              containerPort: 7001
              protocol: TCP
            - name: admin-grpc
              containerPort: 50090
              protocol: TCP
            - name: web-conn
              containerPort: 8000
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,network_gateway=debug"
            - name: RGS_NETWORK_GATEWAY_TCP_ADDR
              value: "0.0.0.0:7001"
            - name: RGS_NETWORK_GATEWAY_ADMIN_GRPC_ADDR
              value: "0.0.0.0:50090"
            - name: RGS_NETWORK_GATEWAY_WEB_CONN_ADDR
              value: "0.0.0.0:8000"
            - name: RGS_NETWORK_GATEWAY_EPMD_ADDR
              value: "0.0.0.0:4369"
            # Erlang cookie via secret, REDACTED filter at log (per 8/27 11:06 JST)
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: network-gateway-secret
                  key: erlang-cookie
          volumeMounts:
            - name: route-table
              mountPath: /etc/network-gateway/routes
              readOnly: true
            - name: tls-certs
              mountPath: /etc/network-gateway/tls
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: tcp-binary
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: admin-grpc
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: route-table
          configMap:
            name: network-gateway-routes
        - name: tls-certs
          secret:
            secretName: network-gateway-tls
---
# Erlang cookie secret stub (per 8/27 11:06 JST hard ban, value 走 kubectl apply --from-literal=...)
# 真实部署: kubectl create secret generic network-gateway-secret -n rust-game-server \
#   --from-literal=erlang-cookie=<REDACTED, 主会话运维生成>
apiVersion: v1
kind: Secret
metadata:
  name: network-gateway-secret
  namespace: rust-game-server
  labels:
    app: network-gateway
    domain: network
type: Opaque
stringData:
  # 占位, 主会话用 kubectl apply --from-literal=erlang-cookie=... 覆盖
  # 任何 log/echo 必须 REDACTED (per 8/27 11:06 JST)
  erlang-cookie: "REPLACE_ME_AT_DEPLOY_TIME"
