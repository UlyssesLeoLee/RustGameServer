apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-gateway
  namespace: rust-game-server
  labels:
    app: network-gateway
    version: "0.1.0"
    domain: network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-gateway
  template:
    metadata:
      labels:
        app: network-gateway
        domain: network
    spec:
      containers:
        - name: network-gateway
          image: ghcr.io/ulyssesleolee/rustgameserver:0.1.0-network-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-binary
              containerPort: 7001
              protocol: TCP
            - name: admin-grpc
              containerPort: 50090
              protocol: TCP
            - name: web-conn
              containerPort: 8000
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,network_gateway=debug"
            - name: RGS_NETWORK_GATEWAY_TCP_ADDR
              value: "0.0.0.0:7001"
            - name: RGS_NETWORK_GATEWAY_ADMIN_GRPC_ADDR
              value: "0.0.0.0:50090"
            - name: RGS_NETWORK_GATEWAY_WEB_CONN_ADDR
              value: "0.0.0.0:8000"
            - name: RGS_NETWORK_GATEWAY_EPMD_ADDR
              value: "0.0.0.0:4369"
            # Erlang cookie via secret, REDACTED filter at log (per 8/27 11:06 JST)
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: network-gateway-secret
                  key: erlang-cookie
          volumeMounts:
            - name: route-table
              mountPath: /etc/network-gateway/routes
              readOnly: true
            - name: tls-certs
              mountPath: /etc/network-gateway/tls
              readOnly: true
            # W15: 7 域 gRPC client pool mTLS 证书 (复用 W10 5 域 cert, 3 NEW 域待抽)
            - name: client-tls
              mountPath: /etc/rgs/certs
              readOnly: true
            # W15: 7 域 k3s svc DNS 配置 (Phase 1.5 拍板 svc DNS 命名)
            - name: svc-dns
              mountPath: /etc/rgs/svc-dns
              readOnly: true
          env:
            # W15: client pool 配置 (cert dir + 默认 host + 7 域 svc DNS)
            - name: RGS_NETWORK_GATEWAY_CLIENT_CERT_DIR
              value: "/etc/rgs/certs"
            - name: RGS_NETWORK_GATEWAY_DEFAULT_HOST
              value: "player-service.rust-game-server.svc.cluster.local"
            - name: RGS_NETWORK_GATEWAY_DOMAIN_SUFFIX
              value: ".svc.cluster.local"
            # W15: 7 域 svc DNS 端点 (per 5 域 default_port + 3 NEW 域占位)
            - name: RGS_SVC_PLAYER_HOST
              value: "player-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_ECONOMY_HOST
              value: "economy-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_MATCH_HOST
              value: "match-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_SOCIAL_HOST
              value: "social-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_ADMIN_HOST
              value: "admin-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_CLUSTER_OPS_HOST
              value: "cluster-ops.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_SCENE_HOST
              value: "scene-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_BATTLE_HOST
              value: "battle-service.rust-game-server.svc.cluster.local"
            - name: RGS_SVC_BATCH_HOST
              value: "batch-service.rust-game-server.svc.cluster.local"
          livenessProbe:
            tcpSocket:
              port: tcp-binary
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: admin-grpc
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: route-table
          configMap:
            name: network-gateway-routes
        - name: tls-certs
          secret:
            secretName: network-gateway-tls
        # W15: 7 域 mTLS client cert (per W10 D:\sszgC\certs\ 5 域 + cluster_ops, 3 NEW 域待抽)
        - name: client-tls
          secret:
            secretName: network-gateway-client-tls
        # W15: 7 域 svc DNS 配置 (configmap, Phase 1.5 拍板命名后落地)
        - name: svc-dns
          configMap:
            name: network-gateway-svc-dns
---
# Erlang cookie secret stub (per 8/27 11:06 JST hard ban, value 走 kubectl apply --from-literal=...)
# 真实部署: kubectl create secret generic network-gateway-secret -n rust-game-server \
#   --from-literal=erlang-cookie=<REDACTED, 主会话运维生成>
apiVersion: v1
kind: Secret
metadata:
  name: network-gateway-secret
  namespace: rust-game-server
  labels:
    app: network-gateway
    domain: network
type: Opaque
stringData:
  # 占位, 主会话用 kubectl apply --from-literal=erlang-cookie=... 覆盖
  # 任何 log/echo 必须 REDACTED (per 8/27 11:06 JST)
  erlang-cookie: "REPLACE_ME_AT_DEPLOY_TIME"
