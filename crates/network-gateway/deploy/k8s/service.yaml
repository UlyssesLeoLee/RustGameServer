apiVersion: v1
kind: Service
metadata:
  name: network-gateway
  namespace: rust-game-server
  labels:
    app: network-gateway
    domain: network
spec:
  type: ClusterIP
  selector:
    app: network-gateway
  ports:
    - name: tcp-binary
      port: 7001
      targetPort: 7001
      protocol: TCP
    - name: admin-grpc
      port: 50090
      targetPort: 50090
      protocol: TCP
    - name: web-conn
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: epmd
      port: 4369
      targetPort: 4369
      protocol: TCP
---
# 内 DNS 解析: sszg_center_6.rust-game-server.svc.cluster.local
# zone 节点走 EPMD + dist, 需 dns 解析 (per 9/4 改进路线图 Phase 4 k3s StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: sszg-center-6
  namespace: rust-game-server
  labels:
    app: network-gateway
    role: center
spec:
  type: ClusterIP
  selector:
    app: network-gateway
    role: center
  ports:
    - name: web-conn
      port: 8000
      targetPort: 8000
      protocol: TCP
