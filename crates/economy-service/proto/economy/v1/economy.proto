// =====================================================
// v3 活动 (5) message - 数据驱动模板
// =====================================================
//
// 数据驱动反例 (per 9/4 MD §4): 9 个 holiday_* 高度重复 → 1 套 ActivityService + 配置
// 不写 9 套 holiday_*_request/_response, 而是用 1 套通用模板 + activity_id 区分
// 配置由 ActivityTemplate 描述, 玩家状态用 ActivityProgress 跟踪

enum ActivityType {
  ACTIVITY_TYPE_UNSPECIFIED = 0;
  ACTIVITY_TYPE_HOLIDAY = 1;        // 节日活动
  ACTIVITY_TYPE_SIGNIN = 2;          // 签到
  ACTIVITY_TYPE_ACHIEVEMENT = 3;     // 成就
  ACTIVITY_TYPE_BATTLEPASS = 4;      // 战令
  ACTIVITY_TYPE_RETURN = 5;          // 回归
  ACTIVITY_TYPE_INVITE = 6;          // 拉新
  ACTIVITY_TYPE_LEVEL_REWARD = 7;    // 等级奖励
  ACTIVITY_TYPE_DAILY = 8;           // 日常
  ACTIVITY_TYPE_WEEKLY = 9;          // 周常
}

// 活动模板 (从配置文件加载)
message ActivityTemplate {
  int32 activity_id = 1;
  string name = 2;
  ActivityType type = 3;
  common.v1.Timestamp starts_at = 4;
  common.v1.Timestamp ends_at = 5;
  int32 max_progress = 6;          // 0 = no progress
  int32 min_level = 7;
  int32 max_level = 8;             // 0 = no limit
  string template_json = 9;        // 活动配置 (JSON: reward tiers, conditions, etc.)
  bool enabled = 10;
}

message ActivityListRequest {
  string player_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool active_only = 4;
}
message ActivityListResponse {
  repeated ActivityTemplate templates = 1;
  int32 total = 2;
  int32 active_count = 3;
}

message ActivityClaimRequest {
  string player_id = 1;
  int32 activity_id = 2;
  int32 tier = 3;                  // 领取的奖励 tier (1-based)
  string idempotency_key = 4;
}
message ActivityClaimResponse {
  bool success = 1;
  int64 reward_amount = 2;
  common.v1.CurrencyType reward_currency = 3;
  int32 remaining_tiers = 4;
  string error_msg = 5;            // "expired" / "level_too_low" / "already_claimed" / "progress_not_enough"
}

message ActivityTemplateRequest {
  string player_id = 1;
  int32 activity_id = 2;
}
message ActivityTemplateResponse {
  ActivityTemplate template = 1;
  int32 player_progress = 2;
  repeated int32 claimed_tiers = 3;
  bool subscribed = 4;
}

message ActivityProgressRequest {
  string player_id = 1;
  int32 activity_id = 2;
  int32 progress_delta = 3;        // 增量上报
  string source = 4;               // "battle" / "shop" / "summon" / etc.
  string idempotency_key = 5;
}
message ActivityProgressResponse {
  int32 new_progress = 1;
  bool tier_unlocked = 2;
  int32 new_unlocked_tier = 3;
}

message ActivitySubscribeRequest {
  string player_id = 1;
  int32 activity_id = 2;
  int32 notify_channel = 3;        // 1=邮件,2=站内,3=推送
  string idempotency_key = 4;
}
message ActivitySubscribeResponse {
  bool subscribed = 1;
  int32 notify_channel = 2;
  int32 subscriber_count = 3;
}
