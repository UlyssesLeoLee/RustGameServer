[package]
name = "economy-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "5 域经济微服务（per DTL-015 §3 / ARC-008 5 独立 DB 原则 / DEC-005 5 域 Lead）"

[[bin]]
name = "economy-service"
path = "src/main.rs"

[features]
# 55.45 sqlx-tracing feature（per RGS-OPEN-QA-001 Q-M-03 + WBS WF-1-55.45）
# 注：sqlx 0.8.6 已硬依赖 tracing（emit query span 默认开启，无需显式 feature）
# 此 feature flag 作为域级总开关，预留 PH-1/53.12 完成后启用全链路 OTel 时的策略隔离
default = ["tracing"]
tracing = []

[dependencies]
# workspace 公共服务
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# 54.1 启用：gRPC server
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
# 54.1 启用：DB
# 55.45 注释：sqlx 0.8.6 已硬依赖 tracing（query 自动 emit tracing::Span）
# 采样率 10-20% 通过 db::sqlx_tracing_sample_ratio() 读取 SQLX_TRACING_SAMPLE_RATIO env
# per Q-M-03 答复"建议 PH-1 先 10-20% 采样" + WBS WF-1-55.45 §3.2
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# 55.21+22 wire-up: mTLS + outbox relay (per RGS-REV-007 CH4+CH1+CH2 / DEC-015 P1)
shared-platform = { path = "../shared-platform" }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
# WF-1-55.32 HI-3: fail-closed 启动 integration test (per RGS-REV-009 V3 L-2)
assert_cmd = "2"
# WF-1-55.28: 6 域 outbox CHECK 幂等 migration 集成测试 (per RGS-REV-009 CR-2)
# WF-1-55.47: reservation 端到端 IT + 混沌测试 + OTel span 断言 (per RGS-OPEN-QA-001 Q-M-07)
#  - integration_reservation.rs: 3 个 IT (create_success / conflict_releases / cleanup_on_failure)
#  - chaos_reservation.rs: 2 P1 (DB 断开 / 死锁) + 1 P2 stub (row 外部 DELETE)
#  - span_assertion.rs: reservation.create → saga.step → reservation.release/cleanup 三层 span 树
# 跑前需设置 DATABASE_URL 指向真 PG; 跳过机制: test 内部检查 env, 不设置则 skip
rgs-testkit = { path = "../rgs-testkit" }
# WF-1-55.47: span 断言收集用 (per RGS-OPEN-QA-001 Q-M-07 答复: tracing 仍可用, OTel SDK 未启用
# 不影响 tracing::span! 宏的本地 subscriber 捕获). tracing-subscriber 在 [dependencies] 已引入,
# dev-dep 不用重复声明.