[package]
name = "shared-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "公共服务库（tracing 初始化 / config / error / mTLS / sqlx + common.proto 编译）"

[dependencies]
# 公共服务
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# 54.3 启用：common.proto 编译
prost = { workspace = true }
# 54.9 启用：gRPC client 运行时（tonic transport）
tonic = { workspace = true }
# 54.9 启用：mTLS 证书（直接版本，不靠 workspace.dependencies）
rustls = "0.23"
# 54.9 启用：异步重试
backoff = { version = "0.4", features = ["tokio"] }
# 54.10 启用：NATS JetStream 消息总线（per DTL-100 §5 + ARC-051 CEM）
async-nats = "0.42"
uuid = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
bytes = "1"
# 54.11 启用：PgOutboxRepository
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
# 54.12 启用：OpenTelemetry SDK 0.24 + OTLP exporter (per DTL-100 §7 tracing/OTel)
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic", "metrics"] }
opentelemetry-semantic-conventions = "0.16"
tracing-opentelemetry = "0.25"

[build-dependencies]
tonic-build = { workspace = true }