[package]
name = "gm-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GM 后台 APIGW(HTTPS+RBAC+mTLS,HTTP→AdminService gRPC 路由,per RGS-BAS-003 §2.1 / 8 域微服务之第 8 域)"

[[bin]]
name = "gm-backend"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# HTTP server(APIGW 入口,per RGS-BAS-003 §2.1)
axum = { version = "0.7", features = ["macros", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
# HTTPS(mTLS 服务端证书)
rustls = { version = "0.23", default-features = false, features = ["logging", "aws_lc_rs", "std"] }
# 共享平台(从 gRPC 客户端、RBAC、TLS)
shared-platform = { path = "../shared-platform" }
# mTLS gRPC 客户端连 AdminService
tonic = { workspace = true }
prost = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# JWT 验证(per TBD-08-01 v0.2 实装)
jsonwebtoken = "9"

[dev-dependencies]
# per 5 域 + cluster-ops 一致模式:fail-closed 启动 + rgs-testkit 集成
assert_cmd = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum-test = "16"
hyper = { version = "1", features = ["full"] }
serde_json = { workspace = true }
# 串行化 env-mutating 测试(per rgs-testkit 1.5 用法)
serial_test = "0.5"
# rgs-testkit:GM 后台 5 个 endpoint stub 阶段不依赖,但 dev-dep 留着供未来
# admin-service gRPC client 实现用
rgs-testkit = { path = "../rgs-testkit" }