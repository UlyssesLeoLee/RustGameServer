[package]
name = "gm-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GM 后台 APIGW (actix-web 4 + RBAC + mTLS, HTTP→AdminService gRPC 路由, per RGS-BAS-003 §2.1 / 8 域微服务之第 8 域). ROPE_CS 同等功能 + 审美 (9 页面 + 15 端点 + SSE), 2026-09-01 actix-web 重写 (per Ulysses 决策)."

[[bin]]
name = "gm-backend"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# HTTP server (actix-web 4 — per 2026-09-01 Ulysses 决策替换 axum 0.7)
actix-web = "4"
# SSE / async streaming
actix-web-lab = "0.24"
async-stream = "0.3"
futures-util = "0.3"
# HTTPS (mTLS 服务端证书)
rustls = { version = "0.23", default-features = false, features = ["logging", "aws_lc_rs", "std"] }
# 共享平台 (gRPC 客户端 / RBAC / TLS)
shared-platform = { path = "../shared-platform" }
# mTLS gRPC 客户端连 AdminService
tonic = { workspace = true }
prost = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# JWT 验证 (per TBD-08-01 v0.2 实装)
jsonwebtoken = "9"
# bcrypt 密码哈希 (ROPE_CS 同等功能)
bcrypt = "0.16"
# 异步 broadcast (SSE 实时事件流)
tokio-stream = { version = "0.1", features = ["sync"] }
# 随机数 (mock 数据生成)
rand = "0.8"
# base64 (canvas image_base64 校验)
base64 = "0.22"
# Bytes (SSE 实时事件流)
bytes = "1"

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
serial_test = "0.5"
rgs-testkit = { path = "../rgs-testkit" }
async-nats = "0.42"
futures-util = "0.3"
player-service = { path = "../player-service" }
admin-service = { path = "../admin-service" }
# proptest 1.11.0 (per Cargo.lock 已有) — 给 unit test 提供 invariant fuzzing
proptest = "1.11"
