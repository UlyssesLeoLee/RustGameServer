[package]
name = "scene-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "7 域场景微服务 — 场景/移动/单位/棋盘/任务/伙伴/剧情/阵法/副本/buff/空间（per 9/4 MD §2 闪烁之光 148 RPC 借鉴）"

[[bin]]
name = "scene-service"
path = "src/main.rs"

[features]
# 默认开启 tracing
default = ["tracing"]
tracing = []

[dependencies]
# workspace 公共服务
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# gRPC server
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
# DB
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# 7 域独立 Lead (per 8/21 JST 5 域独立 Lead 原则扩展)
shared-platform = { path = "../shared-platform" }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
# IT 失败快速 (per RGS-REV-009 V3 L-2)
assert_cmd = "2"
# rgs-testkit 工具支持 (per 4 域 rgs-testkit dev-dep 接入)
rgs-testkit = { path = "../rgs-testkit" }
