[package]
name = "match-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "5 域匹配微服务（per DTL-016 §3 / ARC-008 5 独立 DB 原则 / DEC-005 5 域 Lead）"

[[bin]]
name = "match-service"
path = "src/main.rs"

# WF-1-55.42: 撮合核心函数 benchmark（per RGS-DTL-026 v0.4 §4.1.3 + RGS-OPEN-QA-001 Q-D-10 + ACTIONS-v0.3 A-10）
# criterion harness 自包含，不依赖 libtest；与 main.rs 业务入口解耦
[[bench]]
name = "matchmaking_bench"
harness = false

[features]
# 55.45 sqlx-tracing feature（per RGS-OPEN-QA-001 Q-M-03 + WBS WF-1-55.45）
# 注：sqlx 0.8.6 已硬依赖 tracing（emit query span 默认开启，无需显式 feature）
# 此 feature flag 作为域级总开关，预留 PH-1/53.12 完成后启用全链路 OTel 时的策略隔离
default = ["tracing"]
tracing = []

[dependencies]
# workspace 公共服务
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# 54.1 启用：gRPC server
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
# 54.1 启用：DB
# 55.45 注释：sqlx 0.8.6 已硬依赖 tracing（query 自动 emit tracing::Span）
# 采样率 10-20% 通过 db::sqlx_tracing_sample_ratio() 读取 SQLX_TRACING_SAMPLE_RATIO env
# per Q-M-03 答复"建议 PH-1 先 10-20% 采样" + WBS WF-1-55.45 §3.2
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# 55.21+22 wire-up: mTLS + outbox relay (per RGS-REV-007 CH4+CH1+CH2 / DEC-015 P1)
shared-platform = { path = "../shared-platform" }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
# WF-1-55.32 HI-3: fail-closed 启动 integration test (per RGS-REV-009 V3 L-2)
assert_cmd = "2"
# WF-1-55.44: 4 域 rgs-testkit dev-dep 接入 + 集成测试骨架 (per RGS-OPEN-QA-001 Q-M-02)
rgs-testkit = { path = "../rgs-testkit" }
# WF-1-55.42: criterion.rs 撮合 benchmark（per RGS-DTL-026 v0.4 §4.1.3 + RGS-OPEN-QA-001 Q-D-10 + ACTIONS-v0.3 A-10）
# 不入 workspace.dependencies：match-service 域专属，且只有 dev 场景需要，避免污染其他 4 域
criterion = { version = "0.5", features = ["html_reports"] }
# W36 (2026-08-30): 跨域 SaveReplay saga IT — 引入 replay-service + tonic 端到端 mock server
replay-service = { path = "../replay-service" }
# tonic 0.12 服务端 listen: TcpListenerStream 适配
tokio-stream = { version = "0.1", features = ["net"] }
# IT 需要更精细的时间控制 (per saga retry)
tokio = { workspace = true, features = ["full", "test-util", "time"] }