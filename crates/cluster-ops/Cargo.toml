[package]
name = "cluster-ops"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "5 域集群运营微服务（per DTL-020 §3 / ARC-008 5 独立 DB 原则 / DEC-005 5 域 Lead）"

[[bin]]
name = "cluster-ops"
path = "src/main.rs"

[dependencies]
# workspace 公共服务
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# 54.1 启用：gRPC server
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
# 54.1 启用：DB
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# 55.21+22 wire-up: mTLS + outbox relay (per RGS-REV-007 CH4+CH1+CH2 / DEC-015 P1)
shared-platform = { path = "../shared-platform" }
# WF-1-2074 启用：Prometheus metrics (per RGS-SPEC-DTL-042 §4 + DTL-042 §11.1)
prometheus = "0.13"

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
# WF-1-55.32 HI-3: fail-closed 启动 integration test (per RGS-REV-009 V3 L-2)
assert_cmd = "2"
# M-2071.7 UT OLU 上报 NFR-LCM-007 验证（async block_on）
futures-lite = "2"
# PT worker 派工 v0.1 (9/1 14:15 JST) cluster-ops 域 proptest 补充
# 覆盖 entity ClusterNode 不变量 (heartbeat idempotent / mark_unhealthy stable)
proptest = "1"