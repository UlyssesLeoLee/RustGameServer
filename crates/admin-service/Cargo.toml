[package]
name = "admin-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "5 域管理微服务（per DTL-019 §3 / ARC-008 5 独立 DB 原则 / DEC-005 5 域 Lead）"

[[bin]]
name = "admin-service"
path = "src/main.rs"

[dependencies]
# workspace 公共服务
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
# 54.1 启用：gRPC server
tonic = { workspace = true }
prost = { workspace = true }
# 54.1 启用：DB
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# 55.13 启用：audit_log hash 升级 FNV-1a → SHA-256（per RGS-REV-007 AC5 / DEC-015 P1）
sha2 = "0.10"
hex = "0.4"
# 55.21+22 wire-up: mTLS + outbox relay (per RGS-REV-007 CH4+CH1+CH2 / DEC-015 P1)
shared-platform = { path = "../shared-platform" }

[build-dependencies]
tonic-build = { workspace = true }