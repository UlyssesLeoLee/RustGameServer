syntax = "proto3";
package leaderboard_extra.v1;
import "common/v1/common.proto";
option go_package = "github.com/ulyssesleolee/rustgameserver/proto/leaderboard_extra/v1;leaderboardextra1";

// leaderboard-extra-service —— 排行榜 + 图鉴 扩展域
// 上游依据: 9/4 MD §2 排行榜/图鉴 10 RPC
// 完整 10 RPC 拆 2 子系统: 图鉴 6 + 排行榜扩展 4

service LeaderboardExtraService {
  rpc HealthCheck(common.v1.HealthCheckRequest) returns (common.v1.HealthCheckResponse);

  // 图鉴 (~6 RPC)
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc UnlockCard(UnlockCardRequest) returns (UnlockCardResponse);
  rpc GetCardDetail(GetCardDetailRequest) returns (GetCardDetailResponse);
  rpc GetCollectionProgress(GetCollectionProgressRequest) returns (GetCollectionProgressResponse);

  // 排行榜扩展 (~4 RPC)
  rpc GetServerRank(GetServerRankRequest) returns (GetServerRankResponse);
  rpc GetCrossServerRank(GetCrossServerRankRequest) returns (GetCrossServerRankResponse);
}

message GetCollectionRequest { string player_id = 1; int32 category = 2; }
message GetCollectionResponse { repeated CardEntry cards = 1; int32 total = 2; int32 unlocked = 3; }
message UnlockCardRequest { string player_id = 1; int32 card_id = 2; int32 count = 3; }
message UnlockCardResponse { bool success = 1; int32 new_count = 2; }
message GetCardDetailRequest { int32 card_id = 1; }
message GetCardDetailResponse { CardDetail detail = 1; }
message GetCollectionProgressRequest { string player_id = 1; }
message GetCollectionProgressResponse { int32 total_cards = 1; int32 unlocked = 2; float pct = 3; }
message GetServerRankRequest { int32 board_id = 1; int32 top_n = 2; }
message GetServerRankResponse { repeated RankRow rows = 1; }
message GetCrossServerRankRequest { int32 board_id = 1; int32 top_n = 2; }
message GetCrossServerRankResponse { repeated RankRow rows = 1; }

message CardEntry { int32 card_id = 1; int32 count = 2; bool is_new = 3; int32 rarity = 4; }
message CardDetail { int32 card_id = 1; string name = 2; int32 rarity = 3; string description = 4; int32 max_count = 5; }
message RankRow { int32 rank = 1; string player_id = 2; string display_name = 3; int64 score = 4; }
