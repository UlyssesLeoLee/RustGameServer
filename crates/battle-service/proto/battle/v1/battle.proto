package battle.v1;
import "common/v1/common.proto";
option go_package = "github.com/ulyssesleolee/rustgameserver/proto/battle/v1;battlev1";

// ============================================================
// battle-service v0.1 (per 闪烁之光 借鉴 + RGS-IMPL-PLAN 7 域扩展)
//
// 任务来源: D:\sszgC\改进路线图.md §3 Phase 2 / §0.1 7 域 ready=True
// 上游分析: E:\BaiduNetdiskDownload\闪烁之光\server分析\分析产出\
//   - API清单-全量提取-2026-09-04.tsv (12 个战斗类 proto_*.erl, 249 条)
//   - API清单与RGS借鉴分析-2026-09-04.md §2/§4 (反例: 6 PVP 变体 + 9 holiday_*)
//
// 域职责 (7 域独立 Lead, per 8/21 JST 5 域独立 → 9/1 JST batch 域 → 9/5 JST battle 域):
//   1. BattleEngineService  - 战斗引擎 (proto_200, 31 RPC: 初始化/准备/回合/技能/录像/观战)
//   2. PvPService           - 1 个服务覆盖 6 个 PVP 变体 (proto_202 + proto_243 数据驱动)
//   3. BossService          - PVE BOSS (proto_205, 15 RPC: 个人/世界 BOSS)
//   4. RoomService          - 房间战 + 矿战 (proto_206, 46 RPC: 房间/技能/事件/矿脉)
//   5. InstanceService      - 副本 (proto_207, 6 RPC: 副本基本信息/挑战日志)
//   6. EndlessTowerService  - 无尽塔 (proto_239, 12 RPC: 派出/雇佣/BUFF)
//   7. EscortService        - 护送 (proto_240, 17 RPC: 发起/掠夺/反击)
//   8. HolyEquipService     - 圣器养成 (proto_241, 23 RPC: 进阶/升级/任务/幻化)
//   9. GuildWarService      - 公会战 (proto_242, 17 RPC: 防守/进攻/排行)
//  10. CrossServerService   - 跨服 PVP (proto_243, 19 RPC: 跨服挑战/录像)
//  11. ExpeditionService    - 远征 (proto_244, 15 RPC: 关卡/支援/雇佣)
//  12. HolidayActivityService - 1 个服务覆盖 9 个 holiday_* 变体 (proto_248, 18 RPC: 元宵/灯会/活动, 数据驱动)
//
// 反例原则 (per 9/4 MD §4 + 路线图 §0.3):
//   - 6 个 PVP 变体 不重复 6 套代码, 1 个 PvPService + PvPConfig (ranked/casual/cross-server/...)
//   - 9 个 holiday_* 活动 不重复 9 套代码, 1 个 HolidayActivityService + ActivityConfig (bid:93031/...)
//
// 协议码: 20000-20063 + 20200-20282 + 20500-20542 + 20600-20660 + 20700-20706
//       + 23900-23911 + 24000-24020 + 24100-24135 + 24200-24223 + 24300-24318
//       + 24400-24415 + 24801-24818 (合计 249 条, 9/4 报告 §2 写 241, 实际 249)
//
// 状态: 初版, 8 业务实装 + 241 stub Unimplemented, 30 min 出报告 (per 路线图 §3 W5)
// ============================================================

// ===== 通用 message (跨服务复用) =====

message EmptyRequest {
  string request_id = 1;
  common.v1.PlayerId player = 2;
}

message EmptyResponse {
  bool ok = 1;
  string message = 2;
}

message BattleId {
  string battle_id = 1;
}

message BattleState {
  string battle_id = 1;
  string battle_type = 2;     // "pve" / "pvp" / "boss" / "endless" / ...
  uint32 turn_index = 3;
  common.v1.Status status = 4; // common.v1.Status
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
  // 战斗状态 JSON (业务层解析, 与 match-service 保持一致)
  string snapshot_json = 7;
}

message BattleAction {
  common.v1.PlayerId actor = 1;
  string action_type = 2;     // "use_skill" / "attack" / "defend" / "flee" / ...
  uint32 skill_id = 3;
  string target_id = 4;
  string payload_json = 5;
}

message BattleResult {
  string battle_id = 1;
  bool victory = 2;
  int32 stars = 3;
  // 奖励列表 (item_id, count)
  repeated BattleReward rewards = 4;
  string summary_json = 5;
}

message BattleReward {
  int32 item_id = 1;
  int32 count = 2;
  string description = 3;
}

message BattleLog {
  uint32 turn_index = 1;
  int64 occurred_at_ms = 2;
  string actor_id = 3;
  string text = 4;
  string payload_json = 5;
}

message RoomId {
  string room_id = 1;
}

message RoomInfo {
  string room_id = 1;
  string room_name = 2;
  uint32 max_players = 3;
  uint32 current_players = 4;
  common.v1.Status status = 5;
  string host_id = 6;
  int64 created_at_ms = 7;
}

message BuffInfo {
  uint32 buff_id = 1;
  string name = 2;
  uint32 duration_turns = 3;
  string effect_json = 4;
}

message CompanionInfo {
  string companion_id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 stars = 4;
  string element = 5;
}

message InstanceInfo {
  string instance_id = 1;
  string name = 2;
  uint32 difficulty = 3;
  uint32 required_level = 4;
  bool unlocked = 5;
}

message BountyInfo {
  uint32 bounty_id = 1;
  string target_player = 2;
  int32 reward_amount = 3;
  int64 expires_at_ms = 4;
}

message ActivityTemplate {
  string activity_id = 1;      // bid: 93031/93032/93033 / "lantern" / "adventure" / ...
  string activity_name = 2;
  int64 opens_at_ms = 3;
  int64 closes_at_ms = 4;
  string config_json = 5;       // 数据驱动, 业务层解析
}

message ActivityReward {
  string activity_id = 1;
  int32 item_id = 2;
  int32 count = 3;
  string description = 4;
  bool claimed = 5;
}

message CrossServerEntry {
  uint32 entry_id = 1;
  string player_id = 2;
  string player_name = 3;
  uint32 rank_score = 4;
  uint32 server_id = 5;
}

message GuildWarEntry {
  string guild_id = 1;
  string guild_name = 2;
  uint32 stars = 3;
  uint32 rank = 4;
}

// ============================================================================
// 1. BattleEngineService - 战斗引擎 (proto_200.erl, 31 RPC)
// ============================================================================

service BattleEngineService {
  rpc HealthCheck(common.v1.HealthCheckRequest) returns (common.v1.HealthCheckResponse);

  // === 战斗生命周期 (per proto_200 20000-20009) ===
  rpc BattleInit(EmptyRequest) returns (BattleState);                    // 20000 战斗初始化数据
  rpc BattlePrepare(EmptyRequest) returns (BattleState);                 // 20001 战斗准备
  rpc BattleStart(BattleId) returns (BattleState);                       // 20002 回合开始
  rpc BattleAction(BattleId) returns (BattleState);                      // 20004 使用技能的战斗播报
  rpc BattlePlayComplete(EmptyRequest) returns (EmptyResponse);           // 20005 客户端播放完成
  rpc BattleEnd(BattleId) returns (BattleResult);                        // 20006 战斗结果
  rpc BattleExit(EmptyRequest) returns (EmptyResponse);                  // 20008 退出战斗
  rpc BattleExitForInstance(EmptyRequest) returns (EmptyResponse);       // 20009 退出战斗(神装副本1队)

  // === 战斗重连 / 切磋 (per 20013-20020) ===
  rpc BattleReconnect(EmptyRequest) returns (BattleState);                // 20013 战斗重连
  rpc BattleDuelRequest(EmptyRequest) returns (EmptyResponse);            // 20014 战斗切磋请求
  rpc BattleDuelResponse(EmptyRequest) returns (EmptyResponse);           // 20015 同不同意切磋
  rpc BattleDuelConfirm(EmptyRequest) returns (EmptyResponse);            // 20016 确认切磋
  rpc BattleRoundStartComplete(EmptyRequest) returns (EmptyResponse);    // 20019 回合开始播放完成
  rpc BattleNextWave(EmptyRequest) returns (EmptyResponse);               // 20020 下一波怪物
  rpc BattleChangeSpeed(EmptyRequest) returns (EmptyResponse);            // 20022 改变战斗播放速度

  // === 地图 / 推送 (per 20026-20040) ===
  rpc BattleMapLoadComplete(EmptyRequest) returns (EmptyResponse);       // 20026 地图加载完成
  rpc BattlePushUnit(EmptyRequest) returns (EmptyResponse);              // 20027 推送战斗单位
  rpc BattleReconnectReady(EmptyRequest) returns (EmptyResponse);         // 20028 重连准备好了
  rpc BattleWatchReplay(EmptyRequest) returns (EmptyResponse);           // 20029 观看战斗录像
  rpc BattleRequestState(EmptyRequest) returns (BattleState);            // 20030 请求战斗状态
  rpc BattleDuelSettle(EmptyRequest) returns (BattleResult);             // 20033 切磋的结算
  rpc BattleShareReplay(EmptyRequest) returns (EmptyResponse);           // 20034 录像分享
  rpc BattleCrossServerWatchReplay(EmptyRequest) returns (EmptyResponse);// 20036 跨服查看录像
  rpc BattleSpectate(EmptyRequest) returns (EmptyResponse);              // 20037 观战
  rpc BattleSpectateExit(EmptyRequest) returns (EmptyResponse);          // 20038 退出观战
  rpc BattleSpectateInit(EmptyRequest) returns (EmptyResponse);          // 20039 观战初始化
  rpc BattleSpectateExitNotify(EmptyRequest) returns (EmptyResponse);    // 20040 退出观战通知

  // === 战斗类型选择 (per 20060-20063) ===
  rpc BattleRequestType(EmptyRequest) returns (EmptyResponse);           // 20060 请求指定战斗类型
  rpc BattleEnterMock(EmptyRequest) returns (EmptyResponse);             // 20061 进入指定战斗类型假战斗
  rpc BattleSkip(EmptyRequest) returns (EmptyResponse);                   // 20062 跳过战斗
  rpc BattleAllTypes(EmptyRequest) returns (EmptyResponse);               // 20063 当前所有战斗类型
}

