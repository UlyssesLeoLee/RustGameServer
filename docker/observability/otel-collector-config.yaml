# OTel Collector 配置（per WBS v0.3 §2A.5 WF-1-53.12）
# 接收 5 域 gRPC OTLP + 导出到 Prometheus + 调试输出

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'rgs-services'
          scrape_interval: 15s
          static_configs:
            - targets:
                - player-service:50051
                - economy-service:50052
                - match-service:50053
                - social-service:50054
                - admin-service:50055
                - cluster-ops.service:50056
          metrics_path: /metrics

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: rgs
    const_labels:
      cluster: rgs-dev

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]