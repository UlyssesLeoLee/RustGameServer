not_after = "Sep  9 09:00:00 2027 GMT"

# cert 链验证 SOP (per L-CAND-006 §1.4):
# 1. k8s 节点: openssl x509 -in certs/<domain>-tls.yaml -noout -fingerprint -sha256
# 2. 跨机器: openssl s_client -connect <domain>-service:50051 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256
# 3. 对比 fingerprint 一致 = cert 链 OK
# 4. 不一致 = cert 链 MISMATCH, 退出 1

